<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Среда и Четверг</title>
<meta name="theme-color" content="#14110e">
<meta name="color-scheme" content="dark">
<style>
:root{
  color-scheme:dark;
  --bg:#0f0e0d;
  --side:#17140f;
  --card:#1d1a16;
  --line:#2e2820;
  --tx:#f4efe8;
  --mut:#a39a8d;
  --or:#ff8a1f;
  --grad:linear-gradient(135deg,#ffb04a,#ff6a00);
  --ok:#34d27b;
  --bad:#ff6161;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;margin:0}
body{
  height:100dvh;
  overscroll-behavior:none;
  background:radial-gradient(900px 500px at 15% -10%,#3a2209 0,transparent 60%),radial-gradient(700px 400px at 100% 110%,#2b1606 0,transparent 55%),var(--bg);
  color:var(--tx);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:grid;
  grid-template-columns:300px 1fr;
  overflow:hidden;
}
button,select,textarea,input{font:inherit;color:inherit}

aside{
  background:var(--side);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  min-height:0;
}
.brand{
  display:flex;
  align-items:center;
  gap:11px;
  padding:16px 14px 12px;
  border-bottom:2px solid var(--or);
}
.badge{
  width:42px;
  height:42px;
  border-radius:13px;
  background:var(--grad);
  color:#1a0d00;
  font-weight:900;
  font-size:22px;
  display:grid;
  place-items:center;
  box-shadow:0 4px 18px #ff8a1f55;
  flex-shrink:0;
}
.brand h1{margin:0;font-size:18px;flex:1;line-height:1.15}
.dev{
  border:1px solid var(--line);
  background:#0f0e0d;
  color:var(--ok);
  border-radius:10px;
  padding:3px 9px;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
}

.acct-box{
  margin:12px 14px 0;
  background:#12100d;
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.acct-info{min-width:0;flex:1}
.acct-mail{font-size:13px;font-weight:700;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-coins{font-size:14px;font-weight:900;color:var(--or);margin-top:2px}
.acct-btn{
  background:#1f1b16;
  border:1px solid var(--or);
  color:var(--tx);
  border-radius:10px;
  padding:6px 11px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
  transition:.15s;
}
.acct-btn:hover{background:var(--grad);color:#1a0d00}

.newb{
  margin:12px 14px;
  border:0;
  border-radius:14px;
  padding:13px;
  background:var(--grad);
  color:#1a0d00;
  font-weight:800;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 6px 22px #ff8a1f44;
  transition:transform .15s,filter .15s;
}
.newb:hover{filter:brightness(1.06)}
.newb:active{transform:scale(.97)}
#srch{
  margin:0 14px 10px;
  width:calc(100% - 28px);
  background:#0f0e0d;
  border:1px solid var(--line);
  border-radius:11px;
  padding:8px 11px;
  color:var(--tx);
  font-size:15px;
  outline:none;
}
#srch:focus{border-color:var(--or)}
#list{flex:1;overflow:auto;padding:0 10px}
.it{
  display:flex;
  align-items:center;
  gap:6px;
  padding:9px 10px;
  border-radius:11px;
  cursor:pointer;
  color:var(--mut);
  font-size:15px;
  margin-bottom:3px;
}
.it span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it:hover{background:#221d16}
.it.on{background:#2a2014;color:var(--tx);box-shadow:inset 3px 0 var(--or)}
.it b{opacity:.5;cursor:pointer;padding:0 4px}
.it b:hover{opacity:1;color:var(--bad)}
.foot{
  padding:12px 14px;
  border-top:1px solid var(--line);
}
.seg{
  display:flex;
  background:#0f0e0d;
  border:1px solid var(--line);
  border-radius:13px;
  padding:3px;
}
.seg button{
  flex:1;
  background:none;
  border:0;
  border-radius:10px;
  padding:8px;
  color:var(--mut);
  cursor:pointer;
  font-weight:700;
  transition:.15s;
}
.seg button.on{background:var(--grad);color:#1a0d00}
.tools{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tools button,.top .uib{
  background:#0f0e0d;
  border:1px solid var(--line);
  border-radius:10px;
  padding:7px 10px;
  cursor:pointer;
  transition:.15s;
}
.tools button:hover,.top .uib:hover{border-color:var(--or)}
.tools .uib{flex:1 1 100%;font-weight:700;color:var(--or)}
.voice-toggle.on{border-color:var(--ok);color:var(--ok)}

section{
  display:flex;
  flex-direction:column;
  min-width:0;
  min-height:0;
  height:100%;
}
.top{
  display:none;
  align-items:center;
  gap:8px;
  padding:10px 12px;
  border-bottom:1px solid var(--line);
  background:#14110e;
}
.top button{
  background:none;
  border:1px solid var(--line);
  border-radius:10px;
  font-size:18px;
  padding:3px 10px;
  cursor:pointer;
}
.top-coins{
  margin-left:auto;
  background:#1f1b16;
  border:1px solid var(--or);
  border-radius:999px;
  padding:4px 10px;
  font-size:13px;
  font-weight:800;
  color:var(--or);
  cursor:pointer;
}
.top .uib{font-size:12.5px;color:var(--or);font-weight:700;padding:5px 9px}
#msgs{
  flex:1;
  overflow-y:auto;
  padding:22px 18px;
}
.wrap{max-width:820px;margin:0 auto}

.welcome{text-align:center;padding:4vh 12px 0}
.welcome-logo{
  width:90px;
  height:90px;
  margin:0 auto;
  border-radius:24px;
  background:#181512;
  border:1px solid var(--line);
  box-shadow:0 10px 40px #ff8a1f44;
  display:grid;
  place-items:center;
}
.welcome-logo svg{width:62px;height:62px;filter:drop-shadow(0 0 10px #ff8a1f88)}
.welcome h2{
  margin:16px 0 6px;
  font-size:30px;
  background:var(--grad);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.welcome p{color:var(--mut);margin:0 0 20px;font-size:15.5px}
.chips{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;max-width:720px;margin:0 auto}
.chips button{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:999px;
  padding:10px 16px;
  cursor:pointer;
  transition:.15s;
}
.chips button:hover{border-color:var(--or);transform:translateY(-2px)}

.msg{display:flex;gap:11px;margin:0 0 18px;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.av{
  flex:none;
  width:36px;
  height:36px;
  border-radius:11px;
  background:var(--grad);
  color:#1a0d00;
  font-weight:900;
  display:grid;
  place-items:center;
}
.me{flex-direction:row-reverse}
.me .av{background:#3a3228;color:var(--tx)}
.bub{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:11px 15px;
  max-width:calc(100% - 52px);
  overflow-wrap:anywhere;
}
.me .bub{background:#2b2012;border-color:#5a3d17}
.bub img.pic{
  display:block;
  max-width:100%;
  max-height:520px;
  border-radius:14px;
  border:1px solid var(--line);
  margin:6px 0;
  cursor:zoom-in;
  box-shadow:0 8px 28px #0008;
}
.info{color:var(--mut);font-size:13px;margin:6px 0}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.acts button,.acts a{
  background:none;
  border:1px solid var(--line);
  border-radius:9px;
  color:var(--mut);
  padding:4px 10px;
  cursor:pointer;
  font-size:13.5px;
  text-decoration:none;
}
.acts button:hover,.acts a:hover{border-color:var(--or);color:var(--tx)}
.dots::after{content:"●●●";letter-spacing:3px;color:var(--or);animation:b 1s infinite}
@keyframes b{50%{opacity:.2}}
.err{color:var(--bad)}

.comp{
  padding:10px 16px 14px;
  border-top:1px solid #1f1b16;
  background:linear-gradient(180deg,transparent,#0f0e0d 40%);
}
.dbar{display:none;gap:8px;margin:0 auto 8px;max-width:820px}
.dbar.on{display:flex}
.dbar select{
  flex:1;
  min-width:0;
  font-size:14.5px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  padding:7px 9px;
}
.box{
  display:flex;
  gap:8px;
  align-items:flex-end;
  max-width:820px;
  margin:0 auto;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:8px;
  transition:.15s;
}
.box:focus-within{border-color:var(--or);box-shadow:0 0 0 3px #ff8a1f22}
.box textarea{
  flex:1;
  min-width:0;
  background:none;
  border:0;
  outline:0;
  resize:none;
  max-height:150px;
  padding:8px 6px;
  line-height:1.45;
}
.ic{
  width:42px;
  height:42px;
  flex:none;
  border:0;
  border-radius:13px;
  background:#2a241c;
  font-size:19px;
  cursor:pointer;
  display:grid;
  place-items:center;
  transition:.15s;
}
.ic:hover{filter:brightness(1.1)}
.ic.on{background:var(--grad);color:#1a0d00}
.ic.on#mic{background:#e5484d;color:#fff}
.snd{background:var(--grad);color:#1a0d00;font-weight:900;font-size:19px}
.snd:disabled{opacity:.45;cursor:not-allowed}
.hint{text-align:center;color:var(--mut);font-size:12px;margin-top:7px}
.ov{display:none}

#authModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  backdrop-filter:blur(6px);
  z-index:200;
  display:none;
  place-items:center;
  padding:16px;
}
#authModal.on{display:grid}
.g-card{
  width:100%;
  max-width:425px;
  background:#ffffff;
  color:#202124;
  border:1px solid #dadce0;
  border-radius:12px;
  padding:32px 30px 26px;
  box-shadow:0 12px 45px rgba(0,0,0,.55);
  font-family:"Google Sans",Roboto,Arial,sans-serif;
  position:relative;
}
.g-close{
  position:absolute;
  top:12px;
  right:14px;
  background:none;
  border:0;
  font-size:22px;
  color:#5f6368;
  cursor:pointer;
}
.g-logo{display:flex;justify-content:center;margin-bottom:12px}
.g-title{text-align:center;font-size:24px;font-weight:500;margin:0 0 6px;color:#202124}
.g-sub{text-align:center;font-size:15px;color:#202124;margin:0 0 20px}
.g-field{position:relative;margin-bottom:12px}
.g-field input{
  width:100%;
  padding:14px;
  font-size:16px;
  color:#202124;
  background:#fff;
  border:2px solid #1a73e8;
  border-radius:6px;
  outline:none;
}
.g-field label{
  position:absolute;
  top:-9px;
  left:10px;
  background:#fff;
  padding:0 5px;
  font-size:12px;
  color:#1a73e8;
  font-weight:500;
}
.g-oauth-btn{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  background:#1a73e8;
  border:0;
  border-radius:8px;
  padding:12px 14px;
  font-size:14.5px;
  font-weight:700;
  color:#ffffff;
  cursor:pointer;
  margin-bottom:14px;
}
.g-oauth-btn:hover{background:#1557b0}
.g-btn-next{
  background:#1a73e8;
  color:#ffffff;
  border:0;
  border-radius:6px;
  padding:10px 24px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}

#lightbox{
  position:fixed;
  inset:0;
  background:#000d;
  backdrop-filter:blur(6px);
  z-index:120;
  display:none;
  place-items:center;
  padding:20px;
  cursor:zoom-out;
}
#lightbox.on{display:grid}
#lightbox img{max-width:95vw;max-height:90vh;border-radius:16px;border:1px solid var(--or)}
#toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translate(-50%,20px);
  background:#14110eee;
  border:1px solid var(--or);
  padding:10px 16px;
  border-radius:12px;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:250;
  max-width:90%;
  text-align:center;
  font-size:14px;
}
#toast.on{opacity:1;transform:translate(-50%,0)}

html.m body{grid-template-columns:1fr}
html.m aside{
  position:fixed;
  inset:0 auto 0 0;
  width:285px;
  max-width:86vw;
  z-index:20;
  transform:translateX(-102%);
  transition:transform .25s ease;
}
html.m body.open aside{transform:none;box-shadow:0 0 60px #000}
html.m body.open .ov{display:block;position:fixed;inset:0;background:#0008;z-index:10}
html.m .top{display:flex}
html.m #msgs{padding:14px 10px}
html.m .hint{display:none}
</style>
</head>
<body>
<aside>
  <div class="brand">
    <div class="badge" id="bd">Ч</div>
    <h1>Среда и Четверг</h1>
    <span class="dev" id="dev" title="Статус сервера">● онлайн</span>
  </div>

  <div class="acct-box">
    <div class="acct-info">
      <div class="acct-mail" id="acctMail">suleiman@gmail.com</div>
      <div class="acct-coins">🪙 <span id="acctCoins">10 000</span> монет</div>
    </div>
    <button type="button" class="acct-btn" id="acctBtn">Аккаунт</button>
  </div>

  <button type="button" class="newb" id="newb">+ Новый диалог</button>
  <input id="srch" placeholder="🔍 Поиск по диалогам" autocomplete="off">
  <div id="list"></div>
  <div class="foot">
    <div class="seg" id="modes">
      <button type="button" data-m="wednesday">Среда</button>
      <button type="button" data-m="thursday" class="on">Четверг</button>
    </div>
    <div class="tools">
      <button type="button" class="uib">📱 Мобильная версия</button>
      <button type="button" id="voiceToggle" class="voice-toggle on" title="Голос ассистента">🔊 Голос: Вкл</button>
      <button type="button" id="acc" title="Сменить цвет темы">🎨</button>
      <button type="button" id="fa" title="Шрифт меньше">A−</button>
      <button type="button" id="fb" title="Шрифт больше">A+</button>
      <button type="button" id="exp" title="Скачать историю">⬇ .txt</button>
    </div>
  </div>
</aside>

<div class="ov" id="ov"></div>

<section>
  <div class="top">
    <button type="button" id="menu" aria-label="Меню">☰</button>
    <b id="ttl">Среда и Четверг</b>
    <span class="top-coins" id="topCoins">🪙 10000</span>
    <button type="button" class="uib">🖥 ПК</button>
  </div>
  <div id="msgs">
    <div class="wrap" id="wrap"></div>
  </div>
  <div class="comp">
    <div class="dbar" id="dbar">
      <select id="ss">
        <option value="auto">Стиль: авто</option>
        <option value="photo">Фото (Реализм)</option>
        <option value="art">Эпический Арт</option>
        <option value="anime">Аниме</option>
        <option value="3d">3D Render</option>
        <option value="pixel">Пиксель-арт</option>
      </select>
      <select id="sa">
        <option value="auto">Формат: авто</option>
        <option value="square">Квадрат (1:1)</option>
        <option value="landscape">Горизонт. (16:9)</option>
        <option value="portrait">Вертикаль (9:16)</option>
        <option value="wide">Панорама</option>
      </select>
      <select id="sq">
        <option value="fast">⚡ Кластер (Без 4006 · 50 🪙)</option>
        <option value="hd">🎨 HD Качество (100 🪙)</option>
      </select>
    </div>
    <form class="box" id="form">
      <button type="button" class="ic" id="drawT" title="Режим рисования (Суббота)">🎨</button>
      <button type="button" class="ic" id="mic" title="Голосовой ввод">🎤</button>
      <textarea id="q" rows="1" placeholder="Скажи что-нибудь или напиши «нарисуй огненного дракона»"></textarea>
      <button type="submit" class="ic snd" id="snd" title="Отправить">➤</button>
    </form>
    <div class="hint" id="hint">/помощь · Нажми 🔊 Голос, чтобы ассистент озвучивал ответы вслух как Алиса</div>
  </div>
</section>

<div id="authModal">
  <div class="g-card">
    <button type="button" class="g-close" id="authClose" title="Закрыть">×</button>
    <div class="g-logo">
      <svg width="75" height="24" viewBox="0 0 75 24"><path d="M9.24 8.19v2.46h5.88c-.18 1.38-.64 2.39-1.34 3.1-.86.86-2.2 1.8-4.54 1.8-3.62 0-6.45-2.92-6.45-6.54s2.83-6.54 6.45-6.54c1.95 0 3.38.77 4.43 1.76L15.4 2.5C13.94 1.08 11.98 0 9.24 0 4.28 0 .11 4.04.11 9s4.17 9 9.13 9c2.68 0 4.7-.88 6.28-2.52 1.62-1.62 2.13-3.91 2.13-5.75 0-.57-.04-1.1-.13-1.54H9.24z" fill="#4285F4"/><path d="M25 6.19c-3.21 0-5.83 2.44-5.83 5.81 0 3.34 2.62 5.81 5.83 5.81s5.83-2.46 5.83-5.81c0-3.37-2.62-5.81-5.83-5.81zm0 9.33c-1.76 0-3.28-1.45-3.28-3.52 0-2.09 1.52-3.52 3.28-3.52s3.28 1.43 3.28 3.52c0 2.07-1.52 3.52-3.28 3.52z" fill="#EA4335"/><path d="M53.58 7.49h-.09c-.57-.68-1.67-1.3-3.06-1.3C47.53 6.19 45 8.72 45 12c0 3.26 2.53 5.81 5.43 5.81 1.39 0 2.49-.62 3.06-1.32h.09v.81c0 2.22-1.19 3.41-3.1 3.41-1.56 0-2.53-1.12-2.93-2.07l-2.22.92c.64 1.54 2.33 3.43 5.15 3.43 2.99 0 5.52-1.76 5.52-6.05V6.49h-2.42v1zm-2.93 8.03c-1.76 0-3.1-1.5-3.1-3.52 0-2.05 1.34-3.52 3.1-3.52 1.74 0 3.1 1.5 3.1 3.54.01 2.03-1.36 3.5-3.1 3.5z" fill="#4285F4"/><path d="M38 6.19c-3.21 0-5.83 2.44-5.83 5.81 0 3.34 2.62 5.81 5.83 5.81s5.83-2.46 5.83-5.81c0-3.37-2.62-5.81-5.83-5.81zm0 9.33c-1.76 0-3.28-1.45-3.28-3.52 0-2.09 1.52-3.52 3.28-3.52s3.28 1.43 3.28 3.52c0 2.07-1.52 3.52-3.28 3.52z" fill="#FBBC05"/><path d="M58 .24h2.51v17.57H58z" fill="#34A853"/><path d="M68.26 15.52c-1.3 0-2.22-.59-2.82-1.76l7.77-3.21-.26-.66c-.48-1.3-1.96-3.7-4.97-3.7-2.99 0-5.48 2.35-5.48 5.81 0 3.26 2.46 5.81 5.76 5.81 2.66 0 4.2-1.63 4.84-2.57l-1.98-1.32c-.66.96-1.56 1.6-2.86 1.6zm-.18-7.15c1.03 0 1.91.53 2.2 1.28l-5.25 2.17c0-2.44 1.73-3.45 3.05-3.45z" fill="#EA4335"/></svg>
    </div>
    <h3 class="g-title">Личный баланс</h3>
    <div id="stepEmail">
      <div class="g-field">
        <label for="gEmail">Почта аккаунта</label>
        <input id="gEmail" type="email" value="suleimanisachanov123456789@gmail.com">
      </div>
      <button type="button" class="g-oauth-btn" id="gPopupBtn">
        ⚡ Пополнить баланс на 10 000 🪙
      </button>
      <div class="g-actions">
        <button type="button" class="g-btn-next" id="gNextBtn" style="width:100%">Закрыть</button>
      </div>
    </div>
  </div>
</div>

<script>
const API = "https://raspy-rain-b35e.suleimanisachanov123456789.workers.dev";
const $ = (id) => document.getElementById(id);
const ls = {
  get(k, d = "") { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

let userEmail = ls.get("userEmail", "suleimanisachanov123456789@gmail.com");
let voiceEnabled = ls.get("voiceEnabled", "true") === "true";

function getWalletCoins(email) {
  const key = "wallet_" + String(email || "guest").toLowerCase().trim();
  const saved = ls.get(key, "");
  if (saved === "" || isNaN(Number(saved))) {
    ls.set(key, "10000");
    return 10000;
  }
  return Math.max(0, Number(saved));
}
function setWalletCoins(email, coins) {
  const key = "wallet_" + String(email || "guest").toLowerCase().trim();
  const val = Math.max(0, Number(coins) || 0);
  ls.set(key, String(val));
}

let userCoins = getWalletCoins(userEmail);
let mode = ls.get("mode", "thursday") === "wednesday" ? "wednesday" : "thursday";
let busy = false, drawOn = false, D = [], cur = null;
try {
  const parsed = JSON.parse(ls.get("dlgs", "[]"));
  if (Array.isArray(parsed)) D = parsed.filter((x) => x && typeof x === "object" && Array.isArray(x.msgs));
} catch { D = []; }

const isMobile = matchMedia("(max-width:780px), (pointer:coarse)").matches;

function updateAccountUI() {
  try {
    $("acctMail").textContent = userEmail || "suleiman@gmail.com";
    $("acctCoins").textContent = userCoins.toLocaleString("ru-RU");
    $("topCoins").textContent = "🪙 " + userCoins;
  } catch {}
}

function updateVoiceUI() {
  const btn = $("voiceToggle");
  if (!btn) return;
  btn.className = "voice-toggle " + (voiceEnabled ? "on" : "");
  btn.textContent = voiceEnabled ? "🔊 Голос: Вкл" : "🔇 Голос: Выкл";
}

// Голосовой движок синтеза речи
function speakText(text, character = mode) {
  if (!voiceEnabled || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  
  const clean = text.replace(/[*#_`]/g, "").replace(/https?:\/\/\S+/g, "").trim();
  if (!clean) return;

  const utter = new SpeechSynthesisUtterance(clean);
  utter.lang = "ru-RU";
  
  const voices = window.speechSynthesis.getVoices();
  if (character === "wednesday") {
    utter.pitch = 1.15;
    utter.rate = 1.0;
    const femaleVoice = voices.find(v => v.lang.startsWith("ru") && /female|milena|tatyana|irina/i.test(v.name));
    if (femaleVoice) utter.voice = femaleVoice;
  } else if (character === "sat") {
    utter.pitch = 1.3;
    utter.rate = 1.05;
  } else {
    utter.pitch = 0.95;
    utter.rate = 1.02;
    const maleVoice = voices.find(v => v.lang.startsWith("ru") && /male|yuri|dmitry|alexander/i.test(v.name));
    if (maleVoice) utter.voice = maleVoice;
  }
  window.speechSynthesis.speak(utter);
}

if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => {};
}

$("voiceToggle").onclick = () => {
  voiceEnabled = !voiceEnabled;
  ls.set("voiceEnabled", String(voiceEnabled));
  updateVoiceUI();
  if (voiceEnabled) speakText("Голосовой режим включён. Я слушаю тебя!", mode);
  else window.speechSynthesis?.cancel();
};

$("acctBtn").onclick = () => {
  if (userEmail) $("gEmail").value = userEmail;
  $("authModal").classList.add("on");
};
$("topCoins").onclick = () => $("acctBtn").click();
$("authClose").onclick = () => $("authModal").classList.remove("on");
$("gPopupBtn").onclick = () => {
  userCoins = 10000;
  setWalletCoins(userEmail, userCoins);
  updateAccountUI();
  $("authModal").classList.remove("on");
  toast("Баланс пополнен: 10 000 🪙");
  speakText("Баланс успешно пополнен на десять тысяч монет!");
};
$("gNextBtn").onclick = () => $("authModal").classList.remove("on");

function toast(t) {
  const d = $("toast");
  if (!d) return;
  d.textContent = t;
  d.classList.add("on");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => d.classList.remove("on"), 4500);
}

const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

window.openLightbox = (src) => {
  $("lb-img").src = src;
  $("lightbox").classList.add("on");
};

function md(src) {
  return String(src).split(/```/).map((p, i) => i % 2
    ? `<pre><code>${esc(p.replace(/^[\w+#-]*\n/, ""))}</code></pre>`
    : esc(p)
        .replace(/!\[([^\]]*)\]\((data:image\/[^)]+|https?:\/\/[^)]+)\)/g, '<img class="pic" src="$2" alt="$1" onclick="window.openLightbox(this.src)">')
        .replace(/`([^`\n]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
        .replace(/\n/g, "<br>")
  ).join("");
}

const strip = (t) => String(t).replace(/^\s*\[(Четверг|Среда|Суббота)\]:\s*/i, "");
const scroll = () => { const m = $("msgs"); if (m) m.scrollTop = m.scrollHeight; };

const ZULFIQAR_SVG = `<svg viewBox="0 0 100 100" fill="none" xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)">
  <path d="M18 22 C36 24, 58 42, 73 64 L67 70 C50 48, 30 33, 12 28 L25 26 L18 22 Z" fill="url(#zg)" stroke="#ffb04a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M62 74 C67 69, 73 63, 78 58" stroke="#ff8a1f" stroke-width="5" stroke-linecap="round"/>
  <path d="M72 68 L84 80" stroke="#ff8a1f" stroke-width="6" stroke-linecap="round"/>
  <defs><linearGradient id="zg" x1="12" y1="22" x2="84" y2="80" gradientUnits="userSpaceOnUse"><stop stop-color="#ffb04a"/><stop offset="1" stop-color="#ff6a00"/></linearGradient></defs>
</svg>`;

function save() {
  try {
    ls.set("dlgs", JSON.stringify(D.slice(0, 30).map((d) => ({
      id: d.id,
      title: d.title,
      msgs: (d.msgs || []).map((m) => ({
        role: m.role,
        content: m.content,
        src: m.src,
        info: m.info,
        prompt: m.prompt,
        who: m.who
      }))
    }))));
  } catch {}
}

function renderList() {
  const l = $("list");
  if (!l) return;
  l.innerHTML = "";
  const fq = ($("srch")?.value || "").toLowerCase();
  D.filter((d) => (d.title || "").toLowerCase().includes(fq)).forEach((d) => {
    const e = document.createElement("div");
    e.className = "it" + (d === cur ? " on" : "");
    e.innerHTML = "<span></span><b title='Удалить'>×</b>";
    e.firstChild.textContent = "💬 " + (d.title || "Диалог");
    e.onclick = (ev) => {
      if (ev.target.tagName === "B") {
        D = D.filter((x) => x !== d);
        if (cur === d) cur = null;
        save(); renderList(); renderMsgs();
        return;
      }
      cur = d; renderList(); renderMsgs();
      document.body.classList.remove("open");
    };
    l.appendChild(e);
  });
}

function renderMsgs() {
  const w = $("wrap");
  if (!w) return;
  w.innerHTML = "";
  if (!cur || !Array.isArray(cur.msgs) || !cur.msgs.length) {
    w.innerHTML = `
      <div class="welcome">
        <div class="welcome-logo">${ZULFIQAR_SVG}</div>
        <h2>Среда и Четверг</h2>
        <p>Голосовой ассистент активен · Баланс: ${userCoins.toLocaleString("ru-RU")} 🪙</p>
        <div class="chips"></div>
      </div>`;
    [
      ["⚔️ Нарисуй меч Зульфикар", "нарисуй легендарный меч Зульфикар в неоновом стиле"],
      ["🐉 Нарисуй дракона", "нарисуй огненного дракона над ночным городом"],
      ["🌦 Погода сейчас", "какая погода сегодня?"],
      ["💻 Помоги с кодом", "Напиши красивый скрипт таймера на JavaScript"],
      ["📚 Кто такой Эйнштейн", "Кто такой Альберт Эйнштейн"],
      ["🔐 Сгенерируй пароль", "/пароль 16"],
      ["😄 Шутка", "/шутка"]
    ].forEach(([t, q]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = t;
      b.onclick = () => window.go(q);
      w.querySelector(".chips").appendChild(b);
    });
  } else {
    cur.msgs.forEach((m) => {
      const b = bubble(m.role, m.who);
      fill(b, m);
    });
  }
  scroll();
}

function newDialog() {
  cur = null;
  renderList();
  renderMsgs();
  document.body.classList.remove("open");
  $("q")?.focus();
}

function ensure(first) {
  if (!cur) {
    cur = { id: Date.now(), title: String(first || "Диалог").slice(0, 34), msgs: [] };
    D.unshift(cur);
    renderList();
    $("wrap").innerHTML = "";
  }
}

function bubble(role, who) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "me" : "bot");
  const ic = role === "user" ? "Я" : who === "sat" ? "🎨" : (who || mode) === "wednesday" ? "С" : "Ч";
  d.innerHTML = '<div class="av"></div><div class="bub"></div>';
  d.firstChild.textContent = ic;
  $("wrap").appendChild(d);
  scroll();
  return d.lastChild;
}

function fill(b, m) {
  if (m.src) { b.innerHTML = ""; showImg(b, m); }
  else b.innerHTML = md(m.content || "");
}

async function directChatFallback(text, hist) {
  const sys = mode === "wednesday"
    ? "Ты — Среда, мудрая наставница проекта «Среда и Четверг». Отвечай структурно, интересно и по-русски, кратко как Алиса."
    : "Ты — Четверг, умный и остроумный друг. Отвечай дружелюбно, с лёгким юмором и по делу.";
  const r = await fetch("[https://text.pollinations.ai/openai](https://text.pollinations.ai/openai)", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "openai",
      messages: [{ role: "system", content: sys }, ...hist, { role: "user", content: text }]
    })
  });
  const d = await r.json();
  return d?.choices?.[0]?.message?.content || "Я на связи! Чем помочь?";
}

async function chatSend(text) {
  const hist = cur.msgs.filter((m) => !m.src).slice(-10).map((m) => ({ role: m.role, content: String(m.content || "").slice(0, 600) }));
  cur.msgs.push({ role: "user", content: text });
  const ub = bubble("user"); ub.innerHTML = md(text);
  const b = bubble("assistant"); b.innerHTML = '<span class="dots"></span>';
  let full = "";
  try {
    const r = await fetch(API + "/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        query: text,
        mode,
        history: hist,
        stream: false,
        uid: userEmail,
        mobile: isMobile
      })
    });
    const j = await r.json();
    full = strip(j.response || "");
    if (!full || /Внутренняя ошибка|Кластер занят/i.test(full)) {
      full = await directChatFallback(text, hist);
    }
  } catch {
    full = await directChatFallback(text, hist);
  }
  full = strip(full) || "Готов помочь!";
  b.innerHTML = md(full);
  cur.msgs.push({ role: "assistant", content: full, who: mode });
  speakText(full, mode);
}

function showImg(b, m) {
  const im = document.createElement("img");
  im.className = "pic";
  im.alt = m.content || "Суббота";
  im.onclick = () => window.openLightbox(im.src);

  const info = document.createElement("div");
  info.className = "info";
  info.textContent = m.info || "";

  const x = document.createElement("div");
  x.className = "acts";
  x.innerHTML = '<button type="button">⬇ Скачать</button><button type="button">🔄 Ещё вариант</button><button type="button">🔍 Увеличить</button>';
  x.children[0].onclick = () => {
    const a = document.createElement("a");
    a.href = im.src;
    a.target = "_blank";
    a.download = "subbota-art.jpg";
    document.body.appendChild(a);
    a.click();
    a.remove();
  };
  x.children[1].onclick = () => window.go("нарисуй " + (m.prompt || m.content || "").replace(/^🎨\s*/, ""));
  x.children[2].onclick = () => window.openLightbox(im.src);

  im.src = m.src;
  b.append(im, info, x);
}

const STYLE_TAGS = {
  auto: "cinematic lighting, ultra detailed, high dynamic range, masterpiece",
  photo: "photorealistic raw photography, 85mm lens, natural lighting, 8k resolution",
  art: "epic digital concept art, dramatic lighting, artstation masterpiece, vibrant colors",
  anime: "anime key visual illustration, Makoto Shinkai style, vibrant detailed background",
  "3d": "3D octane render, Unreal Engine 5, raytracing, subsurface scattering",
  pixel: "16-bit pixel art masterpiece, crisp pixels, retro game aesthetic"
};

const ASPECT_DIMS = {
  auto: [1024, 1024],
  square: [1024, 1024],
  landscape: [1280, 720],
  portrait: [720, 1280],
  wide: [1440, 640]
};

async function buildClusterUrls(prompt, styleKey, aspectKey, qualityKey) {
  let en = prompt;
  try {
    const tr = await fetch(`[https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=$](https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=$){encodeURIComponent(prompt)}`);
    const d = await tr.json();
    if (Array.isArray(d?.[0])) en = d[0].map((x) => x?.[0] || "").join(" ").trim() || prompt;
  } catch {}

  if (/зульфикар|zulfiqar/i.test(prompt)) {
    en += ", legendary Islamic bifurcated double-pointed sword Zulfiqar, glowing golden calligraphy, epic neon sparks";
  } else if (/дракон/i.test(prompt)) {
    en += ", majestic fire-breathing dragon with glowing scales soaring over a neon night city";
  }

  const styleTail = STYLE_TAGS[styleKey] || STYLE_TAGS.auto;
  const fullPrompt = `${en}, ${styleTail}`.slice(0, 800);
  const [W, H] = ASPECT_DIMS[aspectKey] || [1024, 1024];
  const seed = Math.floor(Math.random() * 1e9);
  const mdl = qualityKey === "fast" ? "turbo" : "flux";

  const imgUrl = `[https://image.pollinations.ai/prompt/$](https://image.pollinations.ai/prompt/$){encodeURIComponent(fullPrompt)}?width=${W}&height=${H}&seed=${seed}&model=${mdl}&nologo=true`;
  return { url: imgUrl, W, H, mdl };
}

async function drawSend(prompt, shown) {
  const styleKey = $("ss").value;
  const aspectKey = $("sa").value;
  const qualityKey = $("sq").value;
  const cost = qualityKey === "fast" ? 50 : 100;

  if (userCoins < cost) {
    const errText = `Не хватает монет: нужно ${cost} 🪙, у тебя ${userCoins} 🪙.`;
    toast(errText);
    speakText(errText, "sat");
    return;
  }

  speakText("Суббота приняла заказ! Рисую...", "sat");

  cur.msgs.push({ role: "user", content: shown });
  const ub = bubble("user"); ub.textContent = shown;
  const b = bubble("assistant", "sat");
  const t0 = Date.now();
  const tick = () => {
    b.innerHTML = '<span class="dots"></span> <span class="info">Суббота рисует… ' + Math.round((Date.now() - t0) / 1000) + " с</span>";
  };
  tick();
  const timer = setInterval(tick, 1000);

  try {
    const built = await buildClusterUrls(prompt, styleKey, aspectKey, qualityKey);
    userCoins = Math.max(0, userCoins - cost);
    setWalletCoins(userEmail, userCoins);
    updateAccountUI();

    const m = {
      role: "assistant",
      who: "sat",
      content: "🎨 " + prompt,
      prompt,
      src: built.url,
      w: built.W,
      h: built.H,
      info: `${built.W}×${built.H} · ${built.mdl} · списано ${cost} 🪙 (осталось ${userCoins} 🪙)`
    };
    cur.msgs.push(m);
    b.innerHTML = "";
    showImg(b, m);
    speakText("Готово! Посмотри, какой арт получился.", "sat");
  } finally {
    clearInterval(timer);
  }
}

const DRAW_RE = /^(?:\/нарисуй|нарисуй|\/суббота|(?:сгенерируй|создай|сделай)(?:\s+мне)?(?:\s+картинк\S*|\s+фото\S*|\s+изображени\S*|\s+арт)?)\s+([\s\S]+)$/i;

window.go = async function(text) {
  text = String(text || "").trim();
  if (busy || !text) return;
  busy = true;
  $("snd").disabled = true;
  ensure(text);

  const dm = text.match(DRAW_RE);
  try {
    if (drawOn || dm) {
      const p = drawOn ? text : (dm ? dm[1].trim() : text);
      await drawSend(p, text);
    } else {
      await chatSend(text);
    }
  } finally {
    busy = false;
    $("snd").disabled = false;
    save();
    renderList();
    scroll();
  }
};

$("form").onsubmit = (e) => {
  e.preventDefault();
  const v = $("q").value;
  $("q").value = "";
  $("q").style.height = "auto";
  window.go(v);
};
$("q").onkeydown = (e) => {
  if (e.key === "Enter" && !e.shiftKey && !/Mobi|Android/i.test(navigator.userAgent)) {
    e.preventDefault();
    $("form").requestSubmit();
  }
};
$("q").oninput = (e) => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 150) + "px";
};
$("newb").onclick = newDialog;
$("menu").onclick = () => document.body.classList.add("open");
$("ov").onclick = () => document.body.classList.remove("open");
$("drawT").onclick = () => {
  drawOn = !drawOn;
  $("drawT").classList.toggle("on", drawOn);
  $("dbar").classList.toggle("on", drawOn);
  $("q").placeholder = drawOn
    ? "Опиши картинку для Субботы…"
    : "Скажи что-нибудь или напиши «нарисуй огненного дракона»";
};

function setMode(m) {
  mode = m === "wednesday" ? "wednesday" : "thursday";
  ls.set("mode", mode);
  $("bd").textContent = mode === "wednesday" ? "С" : "Ч";
  document.querySelectorAll("#modes button").forEach((b) => b.classList.toggle("on", b.dataset.m === mode));
  if (voiceEnabled) speakText(mode === "wednesday" ? "На связи Среда. Чем займёмся?" : "Привет! Четверг в деле. Что обсудим?", mode);
}
$("modes").onclick = (e) => {
  const b = e.target.closest("button");
  if (b) setMode(b.dataset.m);
};

let ui = ls.get("ui", "auto");
const phone = /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent);
const layout = () => ui === "mobile" ? "m" : ui === "pc" ? "pc" : innerWidth <= 780 ? "m" : "pc";

function applyUI() {
  const L = layout(), h = document.documentElement;
  h.classList.toggle("m", L === "m");
  h.classList.toggle("frame", L === "m" && ui === "mobile" && !phone);
  document.querySelectorAll(".uib").forEach((b) => {
    b.textContent = L === "m" ? "🖥 Версия для ПК" : "📱 Мобильная версия";
  });
  if (L !== "m") document.body.classList.remove("open");
}
function toggleUI() {
  ui = layout() === "m" ? "pc" : "mobile";
  ls.set("ui", ui);
  applyUI();
}
document.querySelectorAll(".uib").forEach((b) => (b.onclick = toggleUI));
addEventListener("resize", () => { if (ui === "auto") applyUI(); });
applyUI();

$("srch").oninput = renderList;
const ACC = [
  ["#ff8a1f", "#ffb04a", "#ff6a00"],
  ["#3b9cff", "#6cc0ff", "#1f6bff"],
  ["#34d27b", "#6ff0a8", "#15a85a"],
  ["#b46bff", "#d3a4ff", "#8a3dff"]
];
function accent(i) {
  const [a, b, c] = ACC[i % ACC.length], st = document.documentElement.style;
  st.setProperty("--or", a);
  st.setProperty("--grad", `linear-gradient(135deg,${b},${c})`);
  ls.set("acc", i % ACC.length);
}
accent(Number(ls.get("acc", 0)));
$("acc").onclick = () => accent(Number(ls.get("acc", 0)) + 1);

let fs = Number(ls.get("fs", 16)) || 16;
const setFs = (d) => {
  fs = Math.min(22, Math.max(13, fs + d));
  document.body.style.fontSize = fs + "px";
  ls.set("fs", fs);
};
setFs(0);
$("fa").onclick = () => setFs(-1);
$("fb").onclick = () => setFs(1);

$("exp").onclick = () => {
  if (!cur || !cur.msgs.length) return toast("Диалог пуст.");
  const t = cur.msgs.map((m) => (m.role === "user" ? "Я: " : "ИИ: ") + (m.content || "")).join("\n\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([t], { type: "text/plain" }));
  a.download = "dialog.txt";
  a.click();
};

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) {
  $("mic").style.display = "none";
} else {
  const rec = new SR();
  rec.lang = "ru-RU";
  let on = false;
  rec.onresult = (e) => {
    $("q").value += ($("q").value ? " " : "") + e.results[0][0].transcript;
    $("q").dispatchEvent(new Event("input"));
    window.go($("q").value);
    $("q").value = "";
  };
  rec.onend = () => { on = false; $("mic").classList.remove("on"); };
  $("mic").onclick = () => {
    if (on) return rec.stop();
    try { rec.start(); on = true; $("mic").classList.add("on"); } catch {}
  };
}

setMode(mode);
updateAccountUI();
updateVoiceUI();
renderList();
renderMsgs();
</script>
</body>
</html>
