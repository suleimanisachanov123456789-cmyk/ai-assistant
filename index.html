<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Среда и Четверг — AI Assistant</title>
<!-- ФАЙЛ 2 — ИНТЕРФЕЙС. Сервер лежит отдельно в worker.js -->
<style>
  :root {
    --bg: #000000;
    --panel: #0e0e0e;
    --panel-2: #161616;
    --border: #2a1a0d;
    --border-2: #3d2a17;
    --text: #f2f2f2;
    --muted: #a08f80;
    --accent: #ff7a1a;
    --accent-hover: #ff9a4d;
    --accent-text: #120800;
    --glow: rgba(255, 122, 26, .25);
  }
  body[data-mode="thursday"] {
    --accent: #ffa500;
    --accent-hover: #ffbf47;
    --accent-text: #1a0f00;
    --glow: rgba(255, 165, 0, .25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; overflow: hidden;
  }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  /* ---------- Боковая панель ---------- */
  .sidebar {
    width: 290px; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 16px; gap: 10px; flex-shrink: 0;
    transition: transform .25s ease; z-index: 30;
  }
  .new-chat-btn {
    background: var(--accent); color: var(--accent-text); border: none;
    padding: 12px 16px; border-radius: 24px; font-size: 14px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; gap: 10px; transition: background .2s, box-shadow .2s;
  }
  .new-chat-btn:hover { background: var(--accent-hover); box-shadow: 0 0 16px var(--glow); }
  .section-title {
    font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: .5px;
    padding-left: 8px; margin-top: 8px;
  }
  .feature-item {
    padding: 10px 12px; border-radius: 8px; font-size: 13px; color: #d6c9bd; cursor: pointer;
    display: flex; align-items: center; gap: 10px; background: var(--panel-2);
    border: 1px solid var(--border); transition: background .2s, color .2s, border-color .2s;
    text-align: left; width: 100%;
  }
  .feature-item:hover { background: #231509; color: #fff; border-color: var(--accent); }
  .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; min-height: 60px; }
  .history-item {
    padding: 9px 10px 9px 12px; border-radius: 8px; font-size: 13px; color: var(--muted);
    cursor: pointer; display: flex; align-items: center; gap: 6px; border-left: 3px solid transparent;
  }
  .history-item .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history-item:hover { background: #1a1a1a; color: #fff; }
  .history-item.active { background: #231509; color: #fff; border-left-color: var(--accent); }
  .history-item .del {
    background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px;
    opacity: 0; padding: 2px 4px; border-radius: 4px;
  }
  .history-item:hover .del, .history-item.active .del { opacity: 1; }
  .history-item .del:hover { color: #ff6b6b; background: var(--border-2); }
  .empty-hint { font-size: 12px; color: #6b5f55; padding: 8px 12px; }

  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 20; }

  /* ---------- Основная область ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
  .app-header {
    padding: 12px 20px; display: flex; justify-content: space-between; align-items: center;
    gap: 12px; border-bottom: 1px solid var(--border); background: var(--bg);
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
  }
  .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .burger {
    display: none; background: none; border: none; color: var(--accent); font-size: 22px;
    cursor: pointer; padding: 4px 8px;
  }
  #headerTitle {
    font-weight: 600; font-size: 15px; color: var(--accent);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .status {
    font-size: 12px; padding: 3px 10px; border-radius: 12px; border: 1px solid var(--border-2);
    white-space: nowrap; flex-shrink: 0; cursor: default;
  }
  .status.check { color: var(--muted); }
  .status.ok { color: #6fdc8c; border-color: #1f4a2b; }
  .status.off { color: var(--accent); border-color: var(--accent); }
  .header-controls { display: flex; gap: 10px; align-items: center; }
  .mode-select, .clear-btn {
    background: var(--panel); color: var(--text); border: 1px solid var(--border-2);
    padding: 7px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; outline: none;
  }
  .clear-btn:hover, .mode-select:hover { background: #231509; }
  .mode-select { border-color: var(--accent); }

  .chat-scroll { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  .chat-messages {
    padding: 24px 20px; display: flex; flex-direction: column; gap: 18px;
    max-width: 850px; width: 100%; margin: 0 auto;
  }
  .msg-row { display: flex; gap: 12px; width: 100%; animation: pop .2s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg-row.user { justify-content: flex-end; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0;
    background: #2a2a2a; color: #fff;
  }
  .ai .avatar { background: var(--accent); color: var(--accent-text); box-shadow: 0 0 12px var(--glow); }
  .user .avatar { background: var(--border-2); order: 2; }
  .bubble {
    padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.6;
    max-width: 78%; word-wrap: break-word; overflow-wrap: anywhere; white-space: pre-wrap;
  }
  .user .bubble { background: #1f1308; color: #fff; border: 1px solid var(--border-2); border-top-right-radius: 4px; }
  .ai .bubble { background: var(--panel); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .bubble strong { color: var(--accent); }
  .bubble code.inline { background: #2a1c10; color: var(--accent-hover); padding: 1px 6px; border-radius: 5px; font-size: 13.5px; }
  .offline-note { font-size: 11px; color: var(--muted); margin-top: 8px; white-space: normal; }
  .code-block { position: relative; margin: 8px 0; white-space: normal; }
  .code-block pre {
    background: #050505; border: 1px solid var(--border-2); border-radius: 10px;
    padding: 14px; overflow-x: auto; font-size: 13.5px; line-height: 1.5; white-space: pre;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #ffd9b3;
  }
  .copy-btn {
    position: absolute; top: 6px; right: 6px; background: var(--border-2); color: var(--text);
    border: none; border-radius: 6px; font-size: 11px; padding: 4px 8px; cursor: pointer;
  }
  .copy-btn:hover { background: var(--accent); color: var(--accent-text); }

  .typing { display: inline-flex; gap: 5px; padding: 6px 2px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }

  /* ---------- Ввод ---------- */
  .input-container {
    padding: 12px 20px calc(20px + env(safe-area-inset-bottom, 0px));
    display: flex; justify-content: center; background: var(--bg);
  }
  .input-box-wrapper {
    width: 100%; max-width: 850px; background: var(--panel); border: 1px solid var(--border-2);
    border-radius: 26px; padding: 8px 8px 8px 20px; display: flex; align-items: flex-end; gap: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,.6); transition: border-color .2s, box-shadow .2s;
  }
  .input-box-wrapper:focus-within { border-color: var(--accent); box-shadow: 0 0 18px var(--glow); }
  textarea#userInput {
    flex: 1; background: transparent; border: none; color: #fff; font-size: 15px; outline: none;
    resize: none; max-height: 160px; line-height: 1.5; padding: 8px 0; font-family: inherit;
  }
  textarea#userInput::placeholder { color: #6b5f55; }
  .icon-btn {
    background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer;
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; transition: background .2s;
  }
  .icon-btn:hover { background: var(--border-2); color: #fff; }
  .icon-btn.rec { background: #8c2f2f; color: #fff; animation: blink 1.2s infinite; }
  .send-btn {
    background: var(--accent); color: var(--accent-text); border: none; width: 38px; height: 38px;
    border-radius: 50%; font-weight: bold; font-size: 17px; cursor: pointer; flex-shrink: 0;
    transition: background .2s, opacity .2s;
  }
  .send-btn:hover { background: var(--accent-hover); }
  .send-btn:disabled { opacity: .4; cursor: not-allowed; }
  .hint { text-align: center; font-size: 11px; color: #6b5f55; padding-top: 6px; }

  /* ---------- Экран бана ---------- */
  .ban-screen {
    position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.96);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .ban-screen[hidden] { display: none; }
  .ban-card {
    max-width: 440px; text-align: center; background: var(--panel);
    border: 1px solid var(--accent); border-radius: 20px; padding: 32px 28px;
    box-shadow: 0 0 40px var(--glow);
  }
  .ban-icon { font-size: 48px; margin-bottom: 12px; }
  .ban-card h2 { color: var(--accent); font-size: 22px; margin-bottom: 12px; }
  .ban-card p { color: #d6c9bd; font-size: 15px; line-height: 1.6; }

  /* ---------- Мобильная версия ---------- */
  @media (max-width: 760px) {
    .sidebar {
      position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-100%);
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
    }
    body.menu-open .sidebar { transform: none; }
    body.menu-open .overlay { display: block; }
    .burger { display: block; }
    .bubble { max-width: 88%; }
    .avatar { width: 30px; height: 30px; }
    .clear-btn .label { display: none; }
    #headerTitle { display: none; }
  }
</style>
</head>
<body data-mode="wednesday">

<div class="overlay" id="overlay"></div>

<!-- Экран бана -->
<div class="ban-screen" id="banScreen" hidden>
  <div class="ban-card">
    <div class="ban-icon">🚫</div>

<!-- Боковая панель -->

<!-- Основная область -->
<main class="main">

      <button class="burger" id="burger" aria-label="Меню">☰</button>
      <span id="headerTitle"></span>

      <div class="hint">Enter — отправить, Shift+Enter — новая строка</div>

</main>

<script>
(function () {
  "use strict";

  // =========================================================================
  // НАСТРОЙКИ
  // Адрес сервера (файл 1 — worker.js). Можно добавить запасные адреса.
  // Если не отвечает ни один — включается автономный режим в браузере.

  const WORKER_URLS = [
    "https://raspy-rain-b35e.suleimanisachanov123456789.workers.dev"
    // , "https://второй-воркер.workers.dev"
  ];
  const STORAGE_KEY = "sreda-chetverg-v2";
  const BAN_KEY = "sc-ban";

  const PING_EVERY = 60000;

    wednesday: {
      title: "Версия: Среда (Умный наставник)",
      welcome: "👋 Привет! Я Среда. Готова обучать программированию, точным наукам, обсуждать кино и мультфильмы и помогать с проектами."
    },
    thursday: {
      title: "Версия: Четверг (Креативный напарник)",
      welcome: "🔥 Йоу! Я Четверг. Обсуждаем игры, Marvel, мультики, ролки и пилим крутой софт!"
    }
  };

  // =========================================================================
  // ЗАЩИТА ДЕТЕЙ (локальная проверка для автономного режима)
  // На сервере (worker.js) работает такая же проверка.
  // =========================================================================

    const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const stemRe = (l) => new RegExp("(^|[^a-zа-я0-9])(?:" + l.map(esc).join("|") + ")", "i");
    const exactRe = (l) => new RegExp("(^|[^a-zа-я0-9])(?:" + l.map(esc).join("|") + ")($|[^a-zа-я0-9])", "i");
    const R = {
      sex: stemRe(["секс", "порн", "интим", "эрот", "голый", "голая", "голые", "голой", "голую", "голым",
        "обнажен", "раздет", "изнасил", "трахат", "трахн", "минет", "сиськ", "оргазм", "мастурб",
        "sex", "porn", "nude", "naked", "erotic", "rape", "hentai", "nsfw", "boob", "orgasm", "masturb"]),
      minorStrong: stemRe(["ребен", "дети", "детей", "детям", "детьми", "детск", "детк", "дитя", "малолет",
        "несовершеннолет", "школьн", "подрост", "лолит", "первоклассн", "младшеклассн", "дошкольн", "тинейдж",
        "child", "kids", "minor", "underage", "teen", "schoolgirl", "schoolboy", "toddler", "preteen"]),
      minorExact: exactRe(["лоли", "шота", "kid", "loli", "shota"]),
      age: /(^|[^0-9])(?:[1-9]|1[0-7])\s*-?\s*(?:лет|год|года|летн|yo|y\.o|years?)/i,
      minorSoft: stemRe(["мальчик", "мальчонк", "девочк", "малыш", "юная", "юный", "юнош", "дочк", "дочер",
        "сынишк", "ученик", "учениц"]),
      gore: stemRe(["расчлен", "пытк", "пытат", "изуродов", "выпотрош", "кровав", "истязан", "зарез", "задуш",
        "обезглав", "убит", "убий", "убью", "замуч", "избив", "избит", "жесток", "мучен", "расстрел"])
    };
    const L2C = { a: "а", c: "с", e: "е", o: "о", p: "р", x: "х", y: "у", k: "к", m: "м", t: "т", h: "н", b: "в" };
    function variants(text) {
      const base = String(text).toLowerCase().replace(/ё/g, "е").replace(/[\u200b-\u200f\u00ad\u2060]/g, "");
      const clean = base.replace(/[*_.\-|~`'"]+/g, "");
      const cyr = clean.replace(/[acepxykmthb]/g, (ch) => L2C[ch]);
      return [base, clean, cyr];
    }
    function classify(text) {
      const vs = variants(text);
      const test = (re) => vs.some((t) => re.test(t));
      const sex = test(R.sex);
      const strong = test(R.minorStrong) || test(R.minorExact) || test(R.age);
      const soft = test(R.minorSoft);
      const gore = test(R.gore);
      if (sex && strong) return "MINOR_SEXUAL";
      if (sex && soft) return "MINOR_SEXUAL_SOFT";
      if (gore && strong) return "GRAPHIC_MINOR";
      if (sex) return "SEXUAL";
      return null;
    }
    return { classify };
  })();

    MINOR_SEXUAL: "🚫 Доступ заблокирован. Сексуальные и откровенные сцены с детьми и несовершеннолетними недопустимы, и в таких играх я участвовать не буду.",
    SEXUAL: "Пожалуйста, не надо в такие игры играть. Сексуальные и откровенные сцены я не пишу ни в каком виде. Давай выберем другой сюжет: приключения, космос, детектив или любимая вселенная.",
    GRAPHIC_MINOR: "Пожалуйста, не надо в такие игры играть. Жестокое насилие над детьми и несовершеннолетними я описывать не буду. Предлагаю другой поворот сюжета."
  };
  SAFE_MSG.MINOR_SEXUAL_SOFT = SAFE_MSG.MINOR_SEXUAL;

  // ---------- Локальный бан и предупреждения ----------
  function getUid() {
    let u = null;
    try { u = localStorage.getItem(UID_KEY); } catch (e) {}
    if (!u) {
      u = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
        : "u" + Date.now() + Math.random().toString(36).slice(2, 10);
      try { localStorage.setItem(UID_KEY, u); } catch (e) {}
    }
    return u;
  }
  const UID = getUid();

  function getBan() {
    try {
      const b = JSON.parse(localStorage.getItem(BAN_KEY) || "null");
      if (b && (!b.until || b.until > Date.now())) return b;
      if (b) localStorage.removeItem(BAN_KEY);
    } catch (e) {}
    return null;
  }
  function showBan() {
    const b = getBan();
    if (!b) return false;
    const until = b.until
      ? "Блокировка действует до " + new Date(b.until).toLocaleString("ru-RU") + "."
      : "Блокировка действует бессрочно.";
    document.getElementById("banText").textContent =
      "Причина: попытка создать недопустимый контент с участием несовершеннолетних или повторные нарушения правил. " + until;
    document.getElementById("banScreen").hidden = false;
    return true;
  }
  function setBan(until) {
    try { localStorage.setItem(BAN_KEY, JSON.stringify({ until: until || null, at: Date.now() })); } catch (e) {}
    showBan();
  }
  function addLocalStrike() {
    let s = { n: 0, t: Date.now() };
    try { s = JSON.parse(localStorage.getItem(STRIKE_KEY) || "null") || s; } catch (e) {}
    if (Date.now() - s.t > 86400000) s = { n: 0, t: Date.now() };
    s.n += 1;
    try { localStorage.setItem(STRIKE_KEY, JSON.stringify(s)); } catch (e) {}
    return s.n;
  }
  // Обработка нарушения без сервера
  function localViolation(type, mode) {
    const tag = mode === "thursday" ? "[Четверг]: " : "[Среда]: ";
    if (type === "MINOR_SEXUAL" || type === "MINOR_SEXUAL_SOFT") {
      setBan(type === "MINOR_SEXUAL" ? null : Date.now() + 86400000);
      return { response: tag + SAFE_MSG[type], violation: type, banned: true };
    }
    const n = addLocalStrike();
    if (n >= STRIKE_LIMIT) {
      setBan(Date.now() + 86400000);
      return { response: tag + SAFE_MSG[type] + "\n\n🚫 Это уже " + n + "-е нарушение, доступ заблокирован на 24 часа.", violation: type, banned: true };
    }
    return { response: tag + SAFE_MSG[type] + "\n\n⚠️ Предупреждение " + n + " из " + STRIKE_LIMIT + ".", violation: type };
  }

  // =========================================================================
  // АВТОНОМНЫЙ «МОЗГ» (работает без сервера)
  // =========================================================================
  function normalizeMath(q) {
    return q
      .replace(/реши (математический )?пример[:\s]*/g, "")
      .replace(/сколько будет|чему равно|посчитай|вычисли|реши/g, "")
      .replace(/в степени/g, "^")
      .replace(/умножить на|умножить|умножь на/g, "*")
      .replace(/разделить на|разделить|подели на/g, "/")
      .replace(/плюс/g, "+")
      .replace(/минус/g, "-")
      .replace(/[×хx](?=\s*\d)/g, (m, off, s) => (/\d\s*$/.test(s.slice(0, off)) ? "*" : m))
      .replace(/÷/g, "/")
      .replace(/(\d),(\d)/g, "$1.$2")
      .replace(/[?=]/g, "")
      .trim();
  }

  function evaluate(expr) {
    const tokens = expr.match(/\d+(?:\.\d+)?|[-+*/^%()]/g);
    if (!tokens || tokens.join("") !== expr.replace(/\s+/g, "")) return null;
    let pos = 0;
    const peek = () => tokens[pos];
    const next = () => tokens[pos++];
    function parseExpr() {
      let v = parseTerm();
      while (peek() === "+" || peek() === "-") {
        const op = next(); const r = parseTerm();
        v = op === "+" ? v + r : v - r;
      }
      return v;
    }
    function parseTerm() {
      let v = parsePow();
      while (peek() === "*" || peek() === "/" || peek() === "%") {
        const op = next(); const r = parsePow();
        if (op === "*") v *= r;
        else if (r === 0) throw new Error("DIV0");
        else v = op === "/" ? v / r : v % r;
      }
      return v;
    }
    function parsePow() {
      const base = parseUnary();
      if (peek() === "^") { next(); return Math.pow(base, parsePow()); }
      return base;
    }
    function parseUnary() {
      if (peek() === "-") { next(); return -parseUnary(); }
      if (peek() === "+") { next(); return parseUnary(); }
      return parseAtom();
    }
    function parseAtom() {
      const t = next();
      if (t === "(") {
        const v = parseExpr();
        if (next() !== ")") throw new Error("PAREN");
        return v;
      }
      if (t === undefined || !/^\d/.test(t)) throw new Error("SYNTAX");
      return parseFloat(t);
    }
    const result = parseExpr();
    if (pos !== tokens.length) throw new Error("SYNTAX");
    return result;
  }

  function tryMath(q) {
    const expr = normalizeMath(q);
    if (!/^[\d\s+\-*/^%().]+$/.test(expr)) return null;
    if (!/\d/.test(expr) || !/[+\-*/^%]/.test(expr.replace(/^\s*-/, ""))) return null;
    try {
      const value = evaluate(expr);
      if (value === null || !isFinite(value)) return null;
      return { expr, value: Math.round(value * 1e10) / 1e10 };
    } catch (e) {
      return { expr, error: e.message === "DIV0" ? "Деление на ноль невозможно." : "Не смог разобрать выражение." };
    }
  }

  const WB = "(^|[^a-zа-яё0-9])";
  function startsWord(text, stem) {
    const esc = stem.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return new RegExp(WB + esc, "i").test(text);
  }
  function matchRule(q) {
    for (const rule of RULES) {
      if (rule.exact && rule.exact.some((w) => new RegExp(WB + w + "($|[^a-zа-яё0-9])", "i").test(q))) return rule;
      if (rule.keys.some((k) => startsWord(q, k))) return rule;
    }
    return null;
  }

  function localBrain(query, mode) {
    const q = query.toLowerCase().trim();
    const wed = mode === "wednesday";
    const math = tryMath(q);
    if (math) {
      if (math.error) return wed ? "[Среда]: " + math.error : "[Четверг]: Ой, тут не вышло: " + math.error + " 🤔";
      return wed
        ? '[Среда]: Произведён расчёт выражения "' + math.expr + '".\n📐 Точный результат: ' + math.value + "."
        : '[Четверг]: Изи матан! Твой пример "' + math.expr + '" щёлкается на раз-два. Получается ровно ' + math.value + " 🧠🔥";
    }
    const rule = matchRule(q);
    if (rule) return typeof rule.reply === "string" ? rule.reply : rule.reply[mode];
    return wed
      ? "[Среда]: Сервер сейчас недоступен, поэтому я работаю автономно: умею считать примеры и знаю базовые темы по программированию, физике, литературе, играм и кино. Для свободного диалога нужен онлайн-режим, попробуй позже."

  }

  function load() {

      }
    } catch (e) {}
    if (!MODES[state.mode]) state.mode = "wednesday";
  }

    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  const currentChat = () => state.chats.find((c) => c.id === state.currentId) || null;

  // ---------- Статус сервера ----------
  function setStatus(kind) {
    els.status.className = "status " + kind;
    els.status.textContent = kind === "ok" ? "● онлайн" : kind === "off" ? "● офлайн" : "● проверка…";
    els.status.title = kind === "ok" ? "Сервер отвечает"
      : kind === "off" ? "Сервер недоступен — работает автономный режим" : "Проверяю сервер…";
  }

  async function fetchWithTimeout(url, options, ms) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    try { return await fetch(url, Object.assign({}, options, { signal: ctrl.signal })); }
    finally { clearTimeout(timer); }
  }

  async function checkServer() {
    for (const url of WORKER_URLS) {
      try {
        const res = await fetchWithTimeout(
          url + "?query=" + encodeURIComponent("привет") + "&mode=wednesday&uid=" + encodeURIComponent(UID), {}, PING_TIMEOUT);
        if (res.ok) {
          setStatus("ok");
          try { const d = await res.json(); if (d && d.banned) setBan(d.until); } catch (e) {}
          return true;
        }
      } catch (e) {}
    }
    setStatus("off");
    return false;
  }

  // Возвращает объект ответа сервера или null, если ни один сервер не ответил
  async function askServers(text, history) {
    for (const url of WORKER_URLS) {
      try {
        const res = await fetchWithTimeout(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: text, mode: state.mode, history, uid: UID })
        }, REQUEST_TIMEOUT);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (data && data.response) return data;
      } catch (e) { /* пробуем следующий сервер */ }
    }
    return null;
  }

  // ---------- Безопасное форматирование ----------
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function inlineFormat(text) {
    return escapeHtml(text)
      .replace(/`([^`\n]+)`/g, '<code class="inline">$1</code>')
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  }
  function renderRich(container, text) {
    container.textContent = "";
    const parts = text.split(/```[\w-]*\n?([\s\S]*?)```/g);
    parts.forEach((part, i) => {
      if (i % 2 === 1) {
        const wrap = document.createElement("div");
        wrap.className = "code-block";
        const pre = document.createElement("pre");
        pre.textContent = part.replace(/\n$/, "");
        const btn = document.createElement("button");
        btn.className = "copy-btn";
        btn.textContent = "Копировать";
        btn.onclick = () => {
          const done = () => { btn.textContent = "Скопировано ✓"; setTimeout(() => (btn.textContent = "Копировать"), 1500); };
          if (navigator.clipboard) navigator.clipboard.writeText(pre.textContent).then(done, done);
        };
        wrap.append(pre, btn);
        container.appendChild(wrap);
      } else if (part) {
        const span = document.createElement("span");
        span.innerHTML = inlineFormat(part);
        container.appendChild(span);
      }
    });
  }

  // ---------- Отрисовка ----------
  function addMessage(role, text, opts) {
    opts = opts || {};
    const row = document.createElement("div");
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "Я" : "✦";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (role === "user") bubble.textContent = text;
    else renderRich(bubble, text);
    if (opts.offline) {
      const note = document.createElement("div");
      note.className = "offline-note";
      note.textContent = "⚡ Автономный режим: ответ сформирован в браузере";
      bubble.appendChild(note);
    }
    row.className = "msg-row " + (role === "user" ? "user" : "ai");
    row.append(avatar, bubble);
    els.messages.appendChild(row);
    scrollDown();
    return row;
  }
  function addTyping() {
    const row = document.createElement("div");
    row.className = "msg-row ai";
    row.innerHTML = '<div class="avatar">✦</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    els.messages.appendChild(row);
    scrollDown();
    return row;
  }
  function scrollDown() {
    requestAnimationFrame(() => { els.scroll.scrollTop = els.scroll.scrollHeight; });
  }

  function renderMessages() {
    els.messages.textContent = "";
    const chat = currentChat();
    if (!chat || chat.messages.length === 0) {
      addMessage("ai", MODES[state.mode].welcome);
      return;
    }
    chat.messages.forEach((m) => addMessage(m.role === "user" ? "user" : "ai", m.content, { offline: m.offline }));
  }

  function renderSidebar() {
    els.list.textContent = "";
    const saved = state.chats.filter((c) => c.messages.length > 0);
    if (!saved.length) {
      const hint = document.createElement("div");
      hint.className = "empty-hint";
      hint.textContent = "Пока пусто — напиши первое сообщение";
      els.list.appendChild(hint);
      return;
    }
    saved.forEach((chat) => {
      const item = document.createElement("div");
      item.className = "history-item" + (chat.id === state.currentId ? " active" : "");
      const t = document.createElement("span");
      t.className = "title";
      t.textContent = chat.title;
      const del = document.createElement("button");
      del.className = "del";
      del.title = "Удалить чат";
      del.textContent = "✕";
      del.onclick = (e) => { e.stopPropagation(); deleteChat(chat.id); };
      item.append(t, del);
      item.onclick = () => { switchChat(chat.id); closeMenu(); };
      els.list.appendChild(item);
    });

  function applyMode() {
    document.body.dataset.mode = state.mode;

  // ---------- Действия ----------
  function switchChat(id) {
    if (busy) return;
    state.currentId = id;
    save(); renderMessages(); renderSidebar();
  }
  function startNewChat() {
    if (busy) return;
    const cur = currentChat();
    if (cur && cur.messages.length === 0) { renderMessages(); closeMenu(); els.input.focus(); return; }
    createChat();
    save(); renderMessages(); renderSidebar(); closeMenu(); els.input.focus();
  }
  function deleteChat(id) {
    if (busy) return;
    state.chats = state.chats.filter((c) => c.id !== id);
    if (state.currentId === id) state.currentId = state.chats.length ? state.chats[0].id : null;
    if (!state.currentId) createChat();
    save(); renderMessages(); renderSidebar();
  }
  function clearCurrent() {
    if (busy) return;
    const chat = currentChat();
    if (!chat) return;
    chat.messages = [];
    chat.title = "Новый чат";
    save(); renderMessages(); renderSidebar();
  }
  function setBusy(v) { busy = v; els.send.disabled = v; }

  async function sendMessage(forcedText) {
    if (busy) return;
    if (getBan()) { showBan(); return; }
    const text = (typeof forcedText === "string" ? forcedText : els.input.value).trim();
    if (!text) return;

    const chat = currentChat() || createChat();
    // история ДО текущего сообщения; сообщения с нарушениями в историю не попадают
    const history = chat.messages
      .filter((m) => !m.blocked)
      .slice(-HISTORY_LIMIT)
      .map((m) => ({ role: m.role, content: m.content }));

    chat.messages.push({ role: "user", content: text });
    const userMsg = chat.messages[chat.messages.length - 1];
    if (chat.messages.length === 1) chat.title = text.length > 32 ? text.slice(0, 32) + "…" : text;
    save();

    if (chat.messages.length === 1) els.messages.textContent = "";
    addMessage("user", text);
    renderSidebar();

    els.input.value = "";
    autoGrow();
    setBusy(true);
    const typing = addTyping();

    // 1) сервер
    let payload = await askServers(text, history);
    let offline = false;

    if (payload) {
      setStatus("ok");
    } else {
      // 2) сервера нет — автономный режим с локальной защитой
      offline = true;
      setStatus("off");
      const v = SAFE.classify(text);
      if (v) payload = localViolation(v, state.mode);
      else payload = { response: localBrain(text, state.mode) };
    }

    typing.remove();
    const answer = String(payload.response);
    const blocked = !!payload.violation;
    if (blocked) userMsg.blocked = true;
    chat.messages.push({ role: "assistant", content: answer, offline: offline, blocked: blocked });
    save();
    addMessage("ai", answer, { offline: offline && !blocked });

    if (payload.banned) setBan(payload.until);

    setBusy(false);
    els.input.focus();
  }

  // ---------- Поле ввода ----------
  function autoGrow() {
    els.input.style.height = "auto";
    els.input.style.height = Math.min(els.input.scrollHeight, 160) + "px";
  }
  els.input.addEventListener("input", autoGrow);
  els.input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      sendMessage();
    }
  });
  els.send.addEventListener("click", () => sendMessage());

  // ---------- Голосовой ввод ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    els.mic.style.display = "";
    const rec = new SR();
    rec.lang = "ru-RU";
    rec.interimResults = false;
    let listening = false;
    rec.onresult = (e) => {
      const t = e.results[0][0].transcript;
      els.input.value = (els.input.value ? els.input.value + " " : "") + t;
      autoGrow();
    };
    rec.onend = () => { listening = false; els.mic.classList.remove("rec"); };
    rec.onerror = () => { listening = false; els.mic.classList.remove("rec"); };
    els.mic.addEventListener("click", () => {
      if (listening) { rec.stop(); return; }
      try { rec.start(); listening = true; els.mic.classList.add("rec"); } catch (e) {}
    });
  }

  // ---------- Прочие события ----------
  els.mode.addEventListener("change", () => {
    state.mode = els.mode.value;
    save(); applyMode();
    const chat = currentChat();
    if (!chat || chat.messages.length === 0) renderMessages();
  });
  els.newChat.addEventListener("click", startNewChat);
  els.clear.addEventListener("click", clearCurrent);
  document.querySelectorAll(".feature-item").forEach((btn) => {
    btn.addEventListener("click", () => { closeMenu(); sendMessage(btn.dataset.prompt); });
  });

  function openMenu() { document.body.classList.add("menu-open"); }
  function closeMenu() { document.body.classList.remove("menu-open"); }
  els.burger.addEventListener("click", openMenu);
  els.overlay.addEventListener("click", closeMenu);

  window.addEventListener("online", checkServer);
  window.addEventListener("offline", () => setStatus("off"));
  setInterval(() => { if (!busy && document.visibilityState === "visible") checkServer(); }, PING_EVERY);

  // ---------- Старт ----------
  load();
  state.chats = state.chats.filter((c) => c.messages.length > 0 || c.id === state.currentId);
  if (!currentChat()) {
    if (state.chats.length) state.currentId = state.chats[0].id;
    else createChat();
  }
  applyMode();
  renderMessages();
  renderSidebar();
  showBan();
  checkServer();
})();
</script>
</body>
</html>
