<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Среда и Четверг — Gemini Orange UI</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
    <style>
        :root {
            --bg-dark: #131110;
            --surface-color: #1e1917;
            --surface-hover: #29221f;
            --border-color: rgba(255, 107, 0, 0.2);
            --accent-orange: #ff6b00;
            --accent-orange-hover: #ff8533;
            --accent-glow: rgba(255, 107, 0, 0.3);
            --text-main: #f5f2ef;
            --text-muted: #b8aba3;
            --code-bg: #0b0908;
        }

        body.wednesday-mode {
            --bg-dark: #0b0d13;
            --surface-color: #131924;
            --surface-hover: #1c2536;
            --border-color: rgba(0, 242, 254, 0.2);
            --accent-orange: #00f2fe;
            --accent-orange-hover: #4facfe;
            --accent-glow: rgba(0, 242, 254, 0.3);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --code-bg: #07090f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.25s, border-color 0.25s, box-shadow 0.25s; }
        
        body {
            font-family: 'Google Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Авторизация админа */
        #authModal {
            position: fixed; inset: 0; background: rgba(8, 6, 5, 0.92); backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .auth-box {
            background: var(--surface-color); border: 1px solid var(--accent-orange); padding: 35px;
            border-radius: 24px; width: 360px; display: flex; flex-direction: column; gap: 18px;
            box-shadow: 0 0 35px var(--accent-glow); text-align: center;
        }
        .auth-box h3 { color: #fff; font-size: 22px; font-weight: 700; }
        .auth-box input {
            background: var(--bg-dark); border: 1px solid var(--border-color); padding: 13px;
            border-radius: 12px; color: #fff; outline: none; font-size: 15px; text-align: center;
        }
        .auth-box input:focus { border-color: var(--accent-orange); box-shadow: 0 0 15px var(--accent-glow); }
        .auth-box button {
            background: var(--accent-orange); color: #fff; border: none; padding: 13px; 
            border-radius: 12px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px var(--accent-glow);
        }

        /* Админ-панель */
        #adminPanel {
            display: none; background: rgba(255, 107, 0, 0.1); border: 1px solid var(--accent-orange);
            padding: 12px 14px; border-radius: 12px; margin-bottom: 12px; font-size: 12px; line-height: 1.5;
        }

        /* Сайдбар в стиле Gemini */
        .sidebar {
            width: 290px; background: var(--surface-color); border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; padding: 18px; gap: 12px; z-index: 10;
        }
        .brand-logo { display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 700; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); color: #fff; }
        .geo-badge { font-size: 11px; font-weight: 500; color: var(--accent-orange); background: rgba(255,255,255,0.05); padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border-color); }

        .new-chat-btn {
            background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border-color);
            color: var(--text-main); padding: 12px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; gap: 10px;
        }
        .new-chat-btn:hover { background: var(--surface-hover); border-color: var(--accent-orange); }

        .section-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin-top: 6px; }
        .features-grid { display: flex; flex-direction: column; gap: 6px; }
        .feature-card {
            background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px 12px; cursor: pointer; display: flex; align-items: center; gap: 10px;
        }
        .feature-card:hover { background: var(--surface-hover); border-color: var(--accent-orange); transform: translateX(3px); }
        .feature-icon { width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
        .feature-info { display: flex; flex-direction: column; gap: 2px; }
        .feature-title { font-size: 13px; font-weight: 500; color: #fff; }
        .feature-desc { font-size: 11px; color: var(--text-muted); }

        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
        .history-item { padding: 8px 10px; border-radius: 8px; font-size: 12px; color: var(--text-muted); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-item:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }

        /* Основная часть */
        .main-container { flex: 1; display: flex; flex-direction: column; height: 100vh; background: var(--bg-dark); }
        .app-header { padding: 12px 24px; background: var(--surface-color); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .status-badge { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
        .pulse-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent-orange); box-shadow: 0 0 10px var(--accent-orange); }

        .header-controls { display: flex; gap: 10px; align-items: center; }
        .voice-toggle-btn, .clear-btn {
            background: rgba(255, 255, 255, 0.04); color: var(--text-main); border: 1px solid var(--border-color); padding: 7px 12px; border-radius: 10px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px;
        }
        .voice-toggle-btn.active { border-color: var(--accent-orange); background: var(--accent-glow); color: #fff; }
        .clear-btn:hover { background: rgba(255, 60, 60, 0.12); color: #ff6b6b; }
        .mode-select {
            background: rgba(255, 255, 255, 0.04); color: #fff; border: 1px solid var(--accent-orange); padding: 7px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; outline: none; cursor: pointer;
        }
        .mode-select option { background: var(--surface-color); color: #fff; }

        /* Сообщения в стиле Google Gemini */
        .chat-messages { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; max-width: 850px; width: 100%; margin: 0 auto; scroll-behavior: smooth; }
        .msg-row { display: flex; gap: 14px; width: 100%; align-items: flex-start; }
        .msg-row.user { justify-content: flex-end; }
        
        .avatar {
            width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 12px; flex-shrink: 0; background: var(--surface-hover); border: 1px solid var(--accent-orange);
            color: var(--accent-orange); box-shadow: 0 0 10px var(--accent-glow);
        }
        .user .avatar {
            background: var(--accent-orange); color: #fff; border: none; order: 2;
        }

        .bubble-wrap { display: flex; flex-direction: column; gap: 6px; max-width: 82%; }
        .bubble { padding: 14px 18px; border-radius: 16px; font-size: 15px; line-height: 1.6; word-wrap: break-word; white-space: pre-wrap; }
        .user .bubble { background: var(--surface-hover); border: 1px solid var(--border-color); color: #fff; border-top-right-radius: 4px; }
        .ai .bubble { background: var(--surface-color); border: 1px solid var(--border-color); color: var(--text-main); border-top-left-radius: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        
        .ai .bubble pre {
            background: var(--code-bg); padding: 12px; border-radius: 10px; overflow-x: auto;
            font-family: 'JetBrains Mono', monospace; font-size: 13px; margin: 8px 0; border: 1px solid var(--border-color);
        }
        .ai .bubble code { font-family: 'JetBrains Mono', monospace; background: rgba(0,0,0,0.3); padding: 2px 5px; border-radius: 4px; }

        .speak-msg-btn { align-self: flex-start; background: transparent; border: none; color: var(--text-muted); font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 2px 4px; }
        .speak-msg-btn:hover { color: var(--accent-orange); }

        /* Поле ввода в стиле Gemini */
        .input-container { padding: 12px 24px 22px 24px; display: flex; justify-content: center; }
        .input-box-wrapper {
            width: 100%; max-width: 850px; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 24px; padding: 8px 16px; display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }
        .input-box-wrapper:focus-within { border-color: var(--accent-orange); box-shadow: 0 0 20px var(--accent-glow); }
        .tool-icon { font-size: 18px; cursor: pointer; opacity: 0.8; padding: 6px; border-radius: 50%; background: transparent; color: #fff; border: none; }
        .tool-icon:hover { opacity: 1; background: var(--surface-hover); }
        .tool-icon.recording { background: rgba(255, 8, 68, 0.2); animation: recPulse 1s infinite; }
        .input-box-wrapper input { flex: 1; background: transparent; border: none; color: #fff; font-size: 15px; outline: none; padding-left: 6px; }
        .send-btn { background: var(--accent-orange); color: #fff; border: none; width: 38px; height: 38px; border-radius: 50%; font-size: 16px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px var(--accent-glow); }
        .send-btn:hover { transform: scale(1.06); background: var(--accent-orange-hover); }
    </style>
</head>
