<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Среда и Четверг — Персональный ИИ</title>
<meta name="theme-color" content="#14110e">
<meta name="color-scheme" content="dark">
<style>
:root{
  color-scheme:dark;
  --bg:#0f0e0d;
  --side:#17140f;
  --card:#1d1a16;
  --line:#2e2820;
  --tx:#f4efe8;
  --mut:#a39a8d;
  --or:#ff8a1f;
  --grad:linear-gradient(135deg,#ffb04a,#ff6a00);
  --ok:#34d27b;
  --bad:#ff6161;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{height:100%}
html,body{margin:0}
body{
  height:var(--vh,100dvh);
  overscroll-behavior:none;
  background:radial-gradient(900px 500px at 15% -10%,#3a2209 0,transparent 60%),radial-gradient(700px 400px at 100% 110%,#2b1606 0,transparent 55%),var(--bg);
  color:var(--tx);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:grid;
  grid-template-columns:300px 1fr;
  overflow:hidden;
}
button,select,textarea,input{font:inherit;color:inherit}

/* ── сайдбар ── */
aside{
  background:var(--side);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  min-height:0;
  padding-top:env(safe-area-inset-top,0);
}
.brand{
  display:flex;
  align-items:center;
  gap:11px;
  padding:16px 14px 12px;
  border-bottom:2px solid var(--or);
}
.badge{
  width:42px;
  height:42px;
  border-radius:13px;
  background:var(--grad);
  color:#1a0d00;
  font-weight:900;
  font-size:22px;
  display:grid;
  place-items:center;
  box-shadow:0 4px 18px #ff8a1f55;
  flex-shrink:0;
}
.brand h1{margin:0;font-size:17px;flex:1;line-height:1.15}
.wallet{
  margin:12px 14px 0;
  background:#14110e;
  border:1px solid var(--or);
  border-radius:12px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 4px 15px #ff8a1f22;
}
.wallet-title{font-size:12px;color:var(--mut)}
.wallet-val{font-size:16px;font-weight:900;color:var(--or)}
.newb{
  margin:12px 14px 0;
  border:0;
  border-radius:14px;
  padding:12px;
  background:var(--grad);
  color:#1a0d00;
  font-weight:800;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 6px 22px #ff8a1f44;
  transition:transform .15s,filter .15s;
}
.newb:hover{filter:brightness(1.06)}
.newb:active{transform:scale(.97)}
#srch{
  margin:10px 14px;
  width:calc(100% - 28px);
  background:#0f0e0d;
  border:1px solid var(--line);
  border-radius:11px;
  padding:8px 11px;
  color:var(--tx);
  font-size:15px;
  outline:none;
}
#srch:focus{border-color:var(--or)}
#list{flex:1;overflow:auto;padding:0 10px}
.it{
  display:flex;
  align-items:center;
  gap:6px;
  padding:9px 10px;
  border-radius:11px;
  cursor:pointer;
  color:var(--mut);
  font-size:15px;
  margin-bottom:3px;
}
.it span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it:hover{background:#221d16}
.it.on{background:#2a2014;color:var(--tx);box-shadow:inset 3px 0 var(--or)}
.foot{
  padding:12px 14px calc(12px + env(safe-area-inset-bottom,0));
  border-top:1px solid var(--line);
}
.seg{
  display:flex;
  background:#0f0e0d;
  border:1px solid var(--line);
  border-radius:13px;
  padding:3px;
}
.seg button{
  flex:1;
  background:none;
  border:0;
  border-radius:10px;
  padding:8px;
  color:var(--mut);
  cursor:pointer;
  font-weight:700;
  transition:.15s;
}
.seg button.on{background:var(--grad);color:#1a0d00}

/* ── основная часть ── */
section{
  display:flex;
  flex-direction:column;
  min-width:0;
  min-height:0;
  height:100%;
  padding-top:env(safe-area-inset-top,0);
}
#msgs{
  flex:1;
  overflow-y:auto;
  padding:22px 18px;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
.wrap{max-width:820px;margin:0 auto}

.welcome{text-align:center;padding:8vh 12px 0}
.welcome h2{
  font-size:30px;
  background:var(--grad);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  margin:0 0 8px;
}
.welcome p{color:var(--mut);margin:0 0 20px}

.msg{display:flex;gap:11px;margin:0 0 18px;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.av{
  flex:none;
  width:36px;
  height:36px;
  border-radius:11px;
  background:var(--grad);
  color:#1a0d00;
  font-weight:900;
  display:grid;
  place-items:center;
}
.me{flex-direction:row-reverse}
.me .av{background:#3a3228;color:var(--tx)}
.bub{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:11px 15px;
  max-width:calc(100% - 52px);
  overflow-wrap:anywhere;
}
.me .bub{background:#2b2012;border-color:#5a3d17}
.bub img.pic{
  display:block;
  max-width:100%;
  border-radius:14px;
  border:1px solid var(--line);
  margin:6px 0;
}
.info{color:var(--mut);font-size:13px;margin:6px 0}
.err{color:var(--bad)}

/* ── панель ввода ── */
.comp{
  padding:10px 16px calc(14px + env(safe-area-inset-bottom,0));
  border-top:1px solid #1f1b16;
  background:linear-gradient(180deg,transparent,#0f0e0d 40%);
}
.dbar{display:none;gap:8px;margin:0 auto 8px;max-width:820px}
.dbar.on{display:flex}
.dbar select{
  flex:1;
  min-width:0;
  font-size:15px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  padding:7px 9px;
}
.box{
  display:flex;
  gap:8px;
  align-items:flex-end;
  max-width:820px;
  margin:0 auto;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:8px;
  transition:.15s;
}
.box:focus-within{border-color:var(--or);box-shadow:0 0 0 3px #ff8a1f22}
.box textarea{
  flex:1;
  min-width:0;
  background:none;
  border:0;
  outline:0;
  resize:none;
  max-height:150px;
  padding:8px 6px;
  line-height:1.45;
}
.ic{
  width:42px;
  height:42px;
  flex:none;
  border:0;
  border-radius:13px;
  background:#2a241c;
  font-size:19px;
  cursor:pointer;
  display:grid;
  place-items:center;
  transition:.15s;
}
.ic.on{background:var(--grad);color:#1a0d00}
.snd{background:var(--grad);color:#1a0d00;font-weight:900;font-size:19px}
.snd:disabled{opacity:.45;cursor:not-allowed}
.hint{text-align:center;color:var(--mut);font-size:12px;margin-top:7px}

#toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translate(-50%,20px);
  background:#14110eee;
  border:1px solid var(--or);
  padding:10px 16px;
  border-radius:12px;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:99;
  max-width:90%;
  text-align:center;
  font-size:14px;
}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<aside>
  <div class="brand">
    <div class="badge" id="bd">Ч</div>
    <h1>Среда и Четверг</h1>
  </div>
  
  <div class="wallet">
    <div>
      <div class="wallet-title">Твой баланс</div>
      <div style="font-size:11px; color:var(--mut)">ID: <span id="uid-lbl" style="font-family:monospace">...</span></div>
    </div>
    <div class="wallet-val"><span id="coins-val">10000</span> 🪙</div>
  </div>

  <button class="newb" id="newb">+ Новый диалог</button>
  <input id="srch" placeholder="🔍 Поиск по диалогам" autocomplete="off">
  <div id="list"></div>
  <div class="foot">
    <div class="seg" id="modes">
      <button type="button" data-m="wednesday">Среда</button>
      <button type="button" data-m="thursday">Четверг</button>
    </div>
  </div>
</aside>

<section>
  <div id="msgs">
    <div class="wrap" id="wrap"></div>
  </div>
  <div class="comp">
    <div class="dbar" id="dbar">
      <select id="engine">
        <option value="cluster">⚡ Безлимитный кластер (Без очередей)</option>
        <option value="hd">🎨 Cloudflare HD (Нейроны)</option>
      </select>
    </div>
    <form class="box" id="form">
      <button type="button" class="ic" id="drawT" title="Режим рисования (Суббота)">🎨</button>
      <textarea id="q" rows="1" placeholder="Напиши сообщение или «нарисуй меч Зульфикар» (-500 🪙)…"></textarea>
      <button type="submit" class="ic snd" id="snd" title="Отправить">➤</button>
    </form>
    <div class="hint">Каждая генерация картинки стоит 500 коинов из твоего личного счёта.</div>
  </div>
</section>

<div id="toast"></div>

<script>
// ▼▼▼ АДРЕС ТВОЕГО CLOUDFLARE WORKER ▼▼▼
const API = "https://raspy-rain-b35e.suleimanisachanov123456789.workers.dev";
// ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

const $ = (id) => document.getElementById(id);
const ls = {
  get(k, d = "") { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

let uid = ls.get("uid");
if (!/^[A-Za-z0-9_-]{8,64}$/.test(uid)) {
  uid = "u_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
  ls.set("uid", uid);
}
$("uid-lbl").textContent = uid.slice(0, 8) + "…";

let mode = ls.get("mode", "thursday"), busy = false, drawOn = false, D = [], cur = null;
try { D = JSON.parse(ls.get("dlgs", "[]")); if (!Array.isArray(D)) D = []; } catch { D = []; }

const scroll = () => { const m = $("msgs"); if (m) m.scrollTop = m.scrollHeight; };
const md = (src) => String(src).replace(/!\[([^\]]*)\]\((data:image\/[^)]+\vert{}https?:\/\/[^)]+)\)/g, '<img class="pic" src="$2" alt="$1">').replace(/\n/g, "<br>");

async function updateCoins() {
  try {
    const r = await fetch(API + "/coins?uid=" + uid);
    const d = await r.json();
    if (d.ok) $("coins-val").textContent = d.coins;
  } catch {}
}

function renderList() {
  const l = $("list"); l.innerHTML = "";
  D.forEach((d) => {
    const e = document.createElement("div");
    e.className = "it" + (d === cur ? " on" : "");
    e.innerHTML = "<span>💬 </span>";
    e.firstChild.textContent += d.title;
    e.onclick = () => { cur = d; renderList(); renderMsgs(); };
    l.appendChild(e);
  });
}

function renderMsgs() {
  const w = $("wrap"); w.innerHTML = "";
  if (!cur || !cur.msgs.length) {
    w.innerHTML = `<div class="welcome"><h2>Среда и Четверг</h2><p>Персональный кошелёк активен. ИИ помнит контекст разговора в этом диалоге.</p></div>`;
  } else {
    cur.msgs.forEach((m) => {
      const d = document.createElement("div");
      d.className = "msg " + (m.role === "user" ? "me" : "bot");
      d.innerHTML = `<div class="av">${m.role === "user" ? "Я" : "ИИ"}</div><div class="bub">${md(m.content)}</div>`;
      w.appendChild(d);
    });
  }
  scroll();
}

function ensure(first) {
  if (!cur) {
    cur = { id: Date.now(), title: first.slice(0, 34) || "Диалог", msgs: [] };
    D.unshift(cur);
    renderList();
    $("wrap").innerHTML = "";
  }
}

async function go(text) {
  text = String(text || "").trim();
  if (busy || !text) return;
  busy = true; $("snd").disabled = true;
  ensure(text);

  cur.msgs.push({ role: "user", content: text });
  renderMsgs();

  const isDraw = drawOn || /^(?:нарисуй|\/нарисуй|\/суббота|сгенерируй|создай)/i.test(text);

  try {
    if (isDraw) {
      const prompt = text.replace(/^(?:нарисуй|\/нарисуй|\/суббота|сгенерируй|создай)\s*/i, "").trim() || text;
      const quality = $("engine").value === "cluster" ? "fast" : "hd";
      const r = await fetch(API + "/saturday", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ uid, prompt, style: "auto", quality })
      });
      const j = await r.json();
      if (j.ok) {
        cur.msgs.push({ role: "assistant", content: `🎨 ${prompt}\n\n![Арт](${j.image})` });
        $("coins-val").textContent = j.coinsLeft;
      } else {
        cur.msgs.push({ role: "assistant", content: `⚠ ${j.error}` });
      }
    } else {
      // ПЕРЕДАЕМ ИСТОРИЮ (history), чтобы бот помнил контекст до конца диалога!
      const histPayload = cur.msgs.slice(-8).map(m => ({ role: m.role, content: m.content }));
      const r = await fetch(API + "/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: text, mode, uid, history: histPayload })
      });
      const j = await r.json();
      cur.msgs.push({ role: "assistant", content: j.response || "Ответ получен." });
      if (j.coins !== undefined) $("coins-val").textContent = j.coins;
    }
  } catch {
    cur.msgs.push({ role: "assistant", content: "Ошибка соединения с сервером." });
  } finally {
    busy = false; $("snd").disabled = false;
    save(); renderList(); renderMsgs();
  }
}

$("form").onsubmit = (e) => { e.preventDefault(); const v = $("q").value; $("q").value = ""; go(v); };
$("newb").onclick = newDialog;
$("drawT").onclick = () => {
  drawOn = !drawOn;
  $("drawT").classList.toggle("on", drawOn);
  $("dbar").classList.toggle("on", drawOn);
  $("q").placeholder = drawOn ? "Опиши картинку для Субботы (-500 🪙)..." : "Напиши сообщение…";
};

function setMode(m) {
  mode = m; ls.set("mode", m);
  $("bd").textContent = m === "wednesday" ? "С" : "Ч";
  document.querySelectorAll("#modes button").forEach((b) => b.classList.toggle("on", b.dataset.m === m));
}
$("modes").onclick = (e) => { const b = e.target.closest("button"); if (b) setMode(b.dataset.m); };

setMode(mode);
renderList();
renderMsgs();
updateCoins();
</script>
</body>
</html>
