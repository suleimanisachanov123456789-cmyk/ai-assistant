<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Среда и Четверг</title>
<meta name="theme-color" content="#14110e">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:dark;--bg:#0f0e0d;--side:#17140f;--card:#1d1a16;--line:#2e2820;--tx:#f4efe8;--mut:#a39a8d;--or:#ff8a1f;--grad:linear-gradient(135deg,#ffb04a,#ff6a00);--ok:#34d27b;--bad:#ff6161}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{height:100%}
html,body{margin:0}
body{height:var(--vh,100dvh);overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{background:radial-gradient(900px 500px at 15% -10%,#3a2209 0,transparent 60%),radial-gradient(700px 400px at 100% 110%,#2b1606 0,transparent 55%),var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;grid-template-columns:290px 1fr;overflow:hidden}
button,select,textarea,input{font:inherit;color:inherit}

/* ── сайдбар ── */
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-top:env(safe-area-inset-top,0)}
.brand{display:flex;align-items:center;gap:11px;padding:16px 14px 12px;border-bottom:2px solid var(--or)}
.badge{width:42px;height:42px;border-radius:13px;background:var(--grad);color:#1a0d00;font-weight:900;font-size:22px;display:grid;place-items:center;box-shadow:0 4px 18px #ff8a1f55}
.brand h1{margin:0;font-size:18px;flex:1;line-height:1.15}
.dev{border:1px solid var(--line);background:#0f0e0d;color:var(--ok);border-radius:10px;padding:3px 9px;font-size:13px;font-weight:700}
.newb{margin:14px 14px 8px;border:0;border-radius:14px;padding:13px;background:var(--grad);color:#1a0d00;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 6px 22px #ff8a1f44;transition:transform .15s}
.newb:active{transform:scale(.97)}
.newb.alt{width:calc(100% - 28px);margin-top:4px;background:linear-gradient(135deg,#2a2117,#1d1710);color:var(--tx);border:1px solid var(--or);box-shadow:0 4px 15px #ff8a1f22;line-height:1.35}
.newb.alt small{color:var(--or);font-weight:700;font-size:12px}

/* ── блок аккаунта и монет в сайдбаре ── */
#acct{padding:0 14px 10px}
#acct .newb.alt{width:100%;margin:0}
.coins{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#271e14,#1a150f);border:1px solid #4a351d;border-radius:12px;padding:9px 12px;margin-bottom:6px;box-shadow:inset 0 1px 0 #ffffff10}
.coins span{font-size:14px;color:var(--mut);font-weight:600}
.coins b{font-size:16px;color:#ffb04a;font-weight:900}
.who{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--mut);padding:0 4px}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.who a{color:var(--or);cursor:pointer;text-decoration:none;font-weight:600}
.who a:hover{text-decoration:underline}

#srch{margin:0 14px 8px;width:calc(100% - 28px);background:#0f0e0d;border:1px solid var(--line);border-radius:11px;padding:8px 11px;color:var(--tx);font-size:15px;outline:0}
#srch:focus{border-color:var(--or)}
#list{flex:1;overflow:auto;padding:0 10px}
.it{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:11px;cursor:pointer;color:var(--mut);font-size:15px}
.it span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it:hover{background:#221d16}
.it.on{background:#2a2014;color:var(--tx);box-shadow:inset 3px 0 var(--or)}
.it b{opacity:.5;cursor:pointer;padding:0 4px}.it b:hover{opacity:1;color:var(--bad)}
.foot{padding:12px 14px calc(12px + env(safe-area-inset-bottom,0));border-top:1px solid var(--line)}
.seg{display:flex;background:#0f0e0d;border:1px solid var(--line);border-radius:13px;padding:3px}
.seg button{flex:1;background:none;border:0;border-radius:10px;padding:8px;color:var(--mut);cursor:pointer;font-weight:600}
.seg button.on{background:var(--grad);color:#1a0d00}

/* ── основная часть ── */
section{display:flex;flex-direction:column;min-width:0;min-height:0;padding-top:env(safe-area-inset-top,0)}
.top{display:none;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:#14110e}
.top button{background:none;border:1px solid var(--line);border-radius:10px;font-size:20px;padding:2px 11px;cursor:pointer}
#msgs{flex:1;overflow:auto;padding:22px 16px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.wrap{max-width:800px;margin:0 auto}
.welcome{text-align:center;padding:7vh 0 0}
.welcome img{width:96px;height:96px;border-radius:26px;box-shadow:0 10px 40px #ff8a1f55}
.welcome h2{margin:18px 0 4px;font-size:28px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome p{color:var(--mut);margin:0 0 22px}
.chips{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.chips button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer;transition:.15s}
.chips button:hover{border-color:var(--or);transform:translateY(-2px)}
.msg{display:flex;gap:11px;margin:0 0 18px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.av{flex:none;width:34px;height:34px;border-radius:11px;background:var(--grad);color:#1a0d00;font-weight:900;display:grid;place-items:center}
.me{flex-direction:row-reverse}.me .av{background:#3a3228;color:var(--tx)}
.bub{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;max-width:calc(100% - 50px);overflow-wrap:anywhere}
.me .bub{background:#2b2012;border-color:#5a3d17}
.bub pre{background:#0b0a09;border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto;font-size:13px;margin:9px 0}
.bub code{background:#0b0a09;border-radius:6px;padding:1px 6px;font-size:.92em}
.bub pre code{padding:0;background:none}
.bub a{color:#ffb066}
.bub img.pic{display:block;max-width:100%;border-radius:12px;border:1px solid var(--line);margin:4px 0}
.info{color:var(--mut);font-size:13px;margin:6px 0}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.acts button,.acts a{background:none;border:1px solid var(--line);border-radius:9px;color:var(--mut);padding:3px 10px;cursor:pointer;font-size:14px;text-decoration:none}
.acts button:hover,.acts a:hover{border-color:var(--or);color:var(--tx)}
.dots::after{content:"●●●";letter-spacing:3px;color:var(--or);animation:b 1s infinite}
@keyframes b{50%{opacity:.2}}
.err{color:var(--bad)}

/* ── ввод ── */
.comp{padding:8px 14px calc(14px + env(safe-area-inset-bottom,0))}
.dbar{display:none;gap:8px;margin:0 auto 8px;max-width:800px}
.dbar.on{display:flex}
.dbar select{flex:1;min-width:0;font-size:16px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 8px}
.box{display:flex;gap:8px;align-items:flex-end;max-width:800px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px;transition:.15s}
.box:focus-within{border-color:var(--or);box-shadow:0 0 0 3px #ff8a1f22}
.box textarea{flex:1;background:none;border:0;outline:0;resize:none;max-height:150px;padding:8px 6px}
.ic{width:42px;height:42px;flex:none;border:0;border-radius:13px;background:#2a241c;font-size:19px;cursor:pointer}
.ic.on{background:var(--grad)}
.snd{background:var(--grad);color:#1a0d00;font-weight:900;font-size:19px}
.snd:disabled{opacity:.45}
.hint{text-align:center;color:var(--mut);font-size:12px;margin-top:7px}
.ov{display:none}

/* ── ПОЛНОЭКРАННОЕ ОКНО РЕГИСТРАЦИИ С ПУЗЫРЯМИ И ЗАЩИТОЙ ОТ БОТОВ ── */
.auth{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 30%,#2d1b08ee,#080706f8);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);overflow:hidden;animation:fadeAuth .3s ease}
.auth.on{display:flex}
@keyframes fadeAuth{from{opacity:0}to{opacity:1}}

/* Анимированные пузыри на весь экран */
.bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bubbles span{position:absolute;bottom:-140px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffb04a88,#ff6a0018 70%);border:1px solid #ffb04a44;box-shadow:inset 0 0 20px #ffb04a44,0 0 30px #ff8a1f22;animation:rise linear infinite}
.bubbles span:nth-child(1){width:90px;height:90px;left:8%;animation-duration:11s}
.bubbles span:nth-child(2){width:150px;height:150px;left:22%;animation-duration:16s;animation-delay:1s}
.bubbles span:nth-child(3){width:65px;height:65px;left:42%;animation-duration:9s;animation-delay:2.5s}
.bubbles span:nth-child(4){width:120px;height:120px;left:64%;animation-duration:14s;animation-delay:.5s}
.bubbles span:nth-child(5){width:75px;height:75px;left:82%;animation-duration:10s;animation-delay:3s}
.bubbles span:nth-child(6){width:180px;height:180px;left:50%;animation-duration:19s;animation-delay:1.5s}
.bubbles span:nth-child(7){width:50px;height:50px;left:15%;animation-duration:8s;animation-delay:4s}
.bubbles span:nth-child(8){width:105px;height:105px;left:88%;animation-duration:13s;animation-delay:2s}
@keyframes rise{
  0%{transform:translateY(0) scale(.85) rotate(0deg);opacity:0}
  15%{opacity:.75}
  85%{opacity:.6}
  100%{transform:translateY(-125vh) scale(1.25) rotate(360deg);opacity:0}
}

/* Центральная карточка-пузырь */
.auth .card{position:relative;z-index:2;width:100%;max-width:440px;background:linear-gradient(160deg,#231d16f2,#15120ef8);border:1px solid #ff8a1f66;border-radius:32px;padding:34px 28px 28px;box-shadow:0 28px 90px #000,0 0 60px #ff8a1f26,inset 0 1px 0 #ffffff22;text-align:center;animation:popCard .35s cubic-bezier(.18,.89,.32,1.28)}
@keyframes popCard{from{transform:scale(.86) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.auth .x{position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#12100d;color:var(--mut);font-size:22px;cursor:pointer;display:grid;place-items:center;transition:.15s}
.auth .x:hover{color:var(--tx);border-color:var(--or);transform:rotate(90deg)}
.auth-orb{width:68px;height:68px;margin:0 auto 14px;border-radius:22px;background:var(--grad);display:grid;place-items:center;font-size:34px;box-shadow:0 10px 30px #ff8a1f66}
.auth h3{margin:0 0 8px;font-size:25px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.auth p{margin:0 0 18px;color:var(--mut);font-size:14.5px;line-height:1.45}
.auth input[type="email"],.auth input#aCode{width:100%;background:#0d0b09;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;font-size:16px;color:var(--tx);outline:0;margin-bottom:14px;transition:.2s}
.auth input:focus{border-color:var(--or);box-shadow:0 0 0 4px #ff8a1f26}

/* Защита от ботов (слайдер-пузырь) */
.bot-box{margin:2px 0 14px;user-select:none}
.bot-track{position:relative;height:52px;background:#0d0b09;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:4px;transition:.25s}
.bot-track.ok{border-color:var(--ok);background:#0f2419}
.bot-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ff8a1f33,#34d27b44);pointer-events:none}
.bot-txt{position:relative;z-index:1;font-size:13.5px;font-weight:700;color:var(--mut);pointer-events:none;padding-left:34px}
.bot-track.ok .bot-txt{color:var(--ok);padding-left:0}
.bot-knob{position:absolute;left:4px;top:4px;width:42px;height:42px;border-radius:50%;background:var(--grad);color:#1a0d00;font-weight:900;font-size:18px;display:grid;place-items:center;cursor:grab;box-shadow:0 4px 15px #ff8a1f66;z-index:2;touch-action:none}
.bot-track.ok .bot-knob{background:var(--ok);color:#062112;box-shadow:0 4px 15px #34d27b66}
.hp-trap{position:absolute;left:-9999px;opacity:0;pointer-events:none;height:0;width:0}

.auth .er{color:var(--bad);font-size:13.5px;min-height:20px;margin-bottom:8px;font-weight:600}
.auth .go{width:100%;border:0;border-radius:16px;padding:14px;background:var(--grad);color:#1a0d00;font-weight:900;font-size:17px;cursor:pointer;box-shadow:0 8px 26px #ff8a1f55;transition:.15s}
.auth .go:hover:not(:disabled){transform:translateY(-1px)}
.auth .go:disabled{opacity:.45;cursor:not-allowed}
.auth .sw{margin-top:14px;font-size:13.5px;color:var(--mut)}
.auth .sw a{color:var(--or);cursor:pointer;text-decoration:none;font-weight:600}

html.frame{background:#070605}
html.frame body{width:390px;height:min(844px,calc(var(--vh,100dvh) - 36px));margin:18px auto;border:10px solid #050505;border-radius:46px;box-shadow:0 30px 90px #000,0 0 0 2px #2a2a2a;overflow:hidden;position:relative;transform:translateZ(0)}
html.frame body::before{content:"";position:absolute;top:0;left:50%;width:120px;height:20px;transform:translateX(-50%);background:#050505;border-radius:0 0 16px 16px;z-index:60}
.tools{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tools button,.top .uib{background:#0f0e0d;border:1px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer}
.tools button:hover,.top .uib:hover{border-color:var(--or)}
.tools .uib{flex:1 1 100%;font-weight:700;color:var(--or)}
.top .uib{margin-left:auto;font-size:13px;color:var(--or)}
.ic.on#mic{background:#e5484d}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#000d;border:1px solid var(--or);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:150;max-width:90%;text-align:center;font-size:14px}
#toast.on{opacity:1;transform:translate(-50%,0)}

html.m{--m:1}
html.m body{grid-template-columns:1fr}
html.m aside{position:fixed;inset:0 auto 0 0;width:285px;max-width:86vw;z-index:20;transform:translateX(-102%);transition:transform .25s}
html.m body.open aside{transform:none;box-shadow:0 0 60px #000}
html.m body.open .ov{display:block;position:fixed;inset:0;background:#0008;z-index:10}
html.m .top{display:flex}
html.m #msgs{padding:14px 10px}
html.m .bub{max-width:calc(100% - 46px);padding:9px 12px}
html.m .av{width:30px;height:30px;border-radius:10px;font-size:14px}
html.m .msg{gap:8px;margin-bottom:14px}
html.m .welcome{padding-top:3vh}.welcome img{width:76px;height:76px;border-radius:21px}.welcome h2{font-size:24px}
html.m .chips button{padding:9px 13px;font-size:15px}
html.m .comp{padding:6px 10px calc(10px + env(safe-area-inset-bottom,0))}
html.m .ic{width:44px;height:44px}
html.m .hint{display:none}
html.m .dbar{flex-wrap:wrap}.dbar select{flex:1 1 30%}
html.m .acts button,.acts a{padding:7px 12px}
</style>
</head>
<body>
<aside>
  <div class="brand"><div class="badge" id="bd">Ч</div><h1>Среда и Четверг</h1><span class="dev" id="dev">● …</span></div>
  <button class="newb" id="newb">+ Новый диалог</button>
  <div id="acct"></div>
  <input id="srch" placeholder="🔍 Поиск по диалогам" autocomplete="off">
  <div id="list"></div>
  <div class="foot">
    <div class="seg" id="modes"><button data-m="wednesday">Среда</button><button data-m="thursday">Четверг</button></div>
    <div class="tools"><button class="uib"></button><button id="acc" title="Цвет темы">🎨</button><button id="fa" title="Шрифт меньше">A−</button><button id="fb" title="Шрифт больше">A+</button><button id="exp" title="Экспорт диалога">⬇ .txt</button></div>
  </div>
</aside>
<div class="ov" id="ov"></div>

<section>
  <div class="top"><button id="menu">☰</button><b id="ttl">Среда и Четверг</b><button class="uib"></button></div>
  <div id="msgs"><div class="wrap" id="wrap"></div></div>
  <div class="comp">
    <div class="dbar" id="dbar">
      <select id="ss"><option value="auto">Стиль: авто</option><option value="photo">Фото</option><option value="art">Арт</option><option value="anime">Аниме</option><option value="3d">3D</option><option value="pixel">Пиксель-арт</option></select>
      <select id="sa"><option value="auto">Формат: авто</option><option value="square">Квадрат</option><option value="landscape">Горизонт.</option><option value="portrait">Вертикаль</option><option value="wide">Панорама</option></select>
      <select id="sq"><option value="hd">HD · 100 🪙</option><option value="fast">Быстро · 50 🪙</option></select>
    </div>
    <form class="box" id="form">
      <button type="button" class="ic" id="drawT" title="Режим рисования (Суббота)">🎨</button>
      <button type="button" class="ic" id="mic" title="Голосовой ввод">🎤</button>
      <textarea id="q" rows="1" placeholder="Напиши сообщение… или «нарисуй дракона»"></textarea>
      <button class="ic snd" id="snd">➤</button>
    </form>
    <div class="hint" id="hint">/помощь · Ctrl+K новый диалог · Alt+D рисовать · Alt+M режим ПК/телефон · ↑ вернуть сообщение</div>
  </div>
</section>

<!-- Полноэкранная регистрация с пузырями и защитой от ботов -->
<div class="auth" id="auth">
  <div class="bubbles">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>
  <form class="card" id="authForm" autocomplete="on">
    <button type="button" class="x" id="authX" title="Закрыть">×</button>
    <div class="auth-orb">🪙</div>
    <h3>Вход и Регистрация</h3>
    <p id="authP"></p>
    <!-- Скрытая ловушка для спам-ботов -->
    <input id="aTrap" class="hp-trap" type="text" tabindex="-1" autocomplete="off">
    <input id="aMail" type="email" inputmode="email" placeholder="you@gmail.com" autocomplete="email" required>
    <input id="aCode" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••••" autocomplete="one-time-code" style="display:none;text-align:center;letter-spacing:10px;font-size:26px">
    
    <!-- Антибот-слайдер -->
    <div class="bot-box" id="botBox">
      <div class="bot-track" id="botTrack">
        <div class="bot-fill" id="botFill"></div>
        <div class="bot-knob" id="botKnob">🫧</div>
        <span class="bot-txt" id="botTxt">Проведи пузырь вправо (защита от ботов)</span>
      </div>
    </div>

    <div class="er" id="authE"></div>
    <button type="submit" class="go" id="authGo">Получить код</button>
    <div class="sw" id="authSw"></div>
  </form>
</div>
<div id="toast"></div>

<script>
// ▼▼▼ ВСТАВЬ АДРЕС СВОЕГО WORKER ▼▼▼
const API = "https://raspy-rain-b35e.suleimanisachanov123456789.workers.dev";
// ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

const $ = (id) => document.getElementById(id);
const ls = {
  get(k, d = "") { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

let uid = ls.get("uid");
if (!/^[A-Za-z0-9_-]{8,64}$/.test(uid)) {
  uid = (crypto.randomUUID?.() || String(Math.random()).slice(2) + Date.now()).replace(/[^A-Za-z0-9]/g, "").slice(0, 32);
  ls.set("uid", uid);
}

let mode = ls.get("mode", "thursday"), busy = false, drawOn = false, D = [], cur = null;
try { D = JSON.parse(ls.get("dlgs", "[]")); } catch { D = []; }

const isMobile = matchMedia("(max-width:780px), (pointer:coarse)").matches;
const slowNet = !!(navigator.connection && (navigator.connection.saveData || /(^|-)(2g|3g)$/.test(navigator.connection.effectiveType || "")));

function tfetch(url, opt, ms) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);

function resetBotCheck() {

(() => {
  const track = $("botTrack"), knob = $("botKnob"), fill = $("botFill"), txt = $("botTxt");
  let drag = false, startX = 0, maxW = 0;
  const start = (e) => {
    if (humanOk) return;
    drag = true;
    startX = (e.touches ? e.touches[0].clientX : e.clientX);
    maxW = track.clientWidth - knob.offsetWidth - 8;
  };
  const move = (e) => {
    if (!drag || humanOk) return;
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - startX;
    const pos = Math.max(0, Math.min(maxW, x));
    knob.style.left = (4 + pos) + "px";
    fill.style.width = (pos + 24) + "px";
    if (pos >= maxW * 0.92) {
      drag = false; humanOk = true;
      humanProof = "hb_" + Date.now() + "_" + DEV.slice(0, 8);
      track.classList.add("ok");
      knob.style.left = (4 + maxW) + "px";
      knob.textContent = "✓";
      fill.style.width = "100%";
      txt.textContent = "Проверка пройдена — ты не бот!";
      $("authE").textContent = "";
      navigator.vibrate?.(15);
    }
  };
  const end = () => {
    if (!drag || humanOk) return;
    drag = false;
    knob.style.left = "4px";
    fill.style.width = "0px";
  };
  knob.addEventListener("mousedown", start);
  knob.addEventListener("touchstart", start, { passive: true });
  window.addEventListener("mousemove", move);
  window.addEventListener("touchmove", move, { passive: true });
  window.addEventListener("mouseup", end);
  window.addEventListener("touchend", end);
})();

  const el = $("acct");
  if (ME && SES) {
    el.innerHTML = '<div class="coins"><span>🪙 Монеты</span><b></b></div><div class="who"><span></span><a id="lo">выйти</a></div>';
    el.querySelector("b").textContent = fmtC(ME.coins);
    el.querySelector(".who span").textContent = "👤 " + ME.name;
    $("lo").onclick = () => logout();
    ls.set("me", JSON.stringify(ME));
  } else {
    el.innerHTML = '<button type="button" class="newb alt" id="lg">🫧 Войти / Регистрация<br><small>🎁 10 000 🪙 в подарок новым</small></button>';
    $("lg").onclick = openAuth;
  }
}

function logout(silent) { SES = ""; ME = null; ls.set("ses", ""); ls.set("me", "null"); renderAcct(); if (!silent) toast("Вы вышли из аккаунта"); }

function setStep(n) {
  authStep = n;
  $("aMail").readOnly = n === 2;
  $("aCode").style.display = n === 2 ? "block" : "none";
  $("botBox").style.display = n === 1 ? "block" : "none";
  $("authE").textContent = "";
  $("authGo").textContent = n === 2 ? "Подтвердить и войти" : "Получить код";
  $("authP").innerHTML = n === 2
    ? 'Код отправили на <b></b>. Проверь «Входящие» и «Спам».'
    : "Введи свою почту (Gmail, Mail.ru, Яндекс, Outlook — любую) — пришлём код из 6 цифр. Новым дарим <b>10 000 🪙</b>.";
  if (n === 2) $("authP").querySelector("b").textContent = authEmail;
  $("authSw").innerHTML = n === 2 ? '<a id="rs"></a> · <a id="ch">Изменить почту</a>' : "";
  if (n === 1) resetBotCheck();
  if (n === 2) {
    $("rs").onclick = () => { if (cd <= 0) sendCode(); };
    $("ch").onclick = () => setStep(1);
    tick(); $("aCode").value = ""; $("aCode").focus();
  }
}

function tick() {
  clearInterval(cdT);
  const f = () => {
    const el = $("rs"); if (!el) return clearInterval(cdT);
    if (cd > 0) { el.textContent = "Отправить снова (" + cd + " c)"; el.style.opacity = .5; cd--; }
    else { el.textContent = "Отправить код снова"; el.style.opacity = 1; clearInterval(cdT); }
  };
  f(); cdT = setInterval(f, 1000);
}

function openAuth() { setStep(1); $("auth").classList.add("on"); setTimeout(() => $("aMail").focus(), 50); }
const closeAuth = () => $("auth").classList.remove("on");
$("authX").onclick = closeAuth;
$("auth").onclick = (e) => { if (e.target === $("auth")) closeAuth(); };

async function sendCode() {
  if ($("aTrap").value) { $("authE").textContent = "Запрос заблокирован защитой от ботов."; return; }
  if (!humanOk) { $("authE").textContent = "Сначала проведи оранжевый пузырь вправо, чтобы подтвердить, что ты не бот!"; return; }
  const email = $("aMail").value.trim();
  if (!email) { $("authE").textContent = "Введи адрес почты."; return; }
  $("authGo").disabled = true; $("authE").textContent = "";
  try {
    const j = await (await tfetch(API + "/auth/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, humanProof })
    }, 25000)).json();
    if (!j.ok) { $("authE").textContent = j.error || "Ошибка"; return; }
    authEmail = email; cd = 60; setStep(2);
  } catch { $("authE").textContent = await netDiag(); } finally { $("authGo").disabled = false; }
}

$("authForm").onsubmit = async (e) => {
  e.preventDefault();
  if (authStep === 1) return sendCode();
  $("authGo").disabled = true; $("authE").textContent = "";
  try {
    const j = await (await tfetch(API + "/auth/verify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: authEmail, code: $("aCode").value })
    }, 20000)).json();
    if (!j.ok) { $("authE").textContent = j.error || "Ошибка"; return; }
    SES = j.token; ls.set("ses", SES); ME = { name: j.name, coins: j.coins }; renderAcct(); closeAuth();
    toast(j.gift ? "🎉 Добро пожаловать! Тебе начислено " + fmtC(j.coins) + " 🪙" : "С возвращением! У тебя " + fmtC(j.coins) + " 🪙");
  } catch { $("authE").textContent = await netDiag(); } finally { $("authGo").disabled = false; }
};

async function refreshMe() {
  if (!SES) return;
  try {
    const r = await fetch(API + "/me", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    const j = await r.json();
    if (j.ok) ME = { name: j.name, coins: j.coins };
    else if (r.status === 401) { SES = ""; ME = null; ls.set("ses", ""); }
  } catch {}
  renderAcct();
}

$("drawT").addEventListener("click", () => { if (!SES && !drawOn) setTimeout(() => { if (drawOn) openAuth(); }, 0); });
if (slowNet) $("sq").value = "fast";
$("q").addEventListener("focus", () => setTimeout(() => { window.scrollTo(0, 0); scroll(); }, 120));
setMode(mode); renderList(); renderMsgs(); ping(); setInterval(ping, 60000);
renderAcct(); refreshMe();
</script>
</body>
</html>
