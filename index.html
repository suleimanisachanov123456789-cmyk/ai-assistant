<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Среда и Четверг — AI Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #131314; color: #e3e3e3; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .app-container { width: 850px; height: 700px; background: #1e1f20; border-radius: 12px; display: flex; flex-direction: column; box-shadow: 0 8px 24px rgba(0,0,0,0.4); overflow: hidden; }
        .app-header { padding: 18px 24px; background: #1e1f20; border-bottom: 1px solid #2d2e30; font-size: 16px; font-weight: 600; color: #f1f3f4; display: flex; justify-content: space-between; align-items: center; }
        .mode-select { background: #2b2c2f; color: #fff; border: 1px solid #444; padding: 6px 12px; border-radius: 6px; font-size: 14px; outline: none; cursor: pointer; }
        .chat-messages { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
        .msg-row { display: flex; gap: 14px; max-width: 85%; }
        .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row.ai { align-self: flex-start; }
        .avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0; background: #3c4043; color: #fff; }
        .user .avatar { background: #8ab4f8; color: #202124; }
        .bubble { padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
        .user .bubble { background: #2b2c2f; color: #f1f3f4; border-top-right-radius: 3px; }
        .ai .bubble { background: #1e1f20; color: #e3e3e3; border-top-left-radius: 3px; }
        .input-wrapper { padding: 18px 24px; background: #1e1f20; border-top: 1px solid #2d2e30; display: flex; gap: 12px; align-items: center; }
        .input-box { flex: 1; background: #2b2c2f; border-radius: 24px; padding: 10px 18px; display: flex; align-items: center; }
        .input-box input { flex: 1; background: transparent; border: none; color: #fff; font-size: 14px; outline: none; }
        .send-btn { background: #8ab4f8; color: #202124; border: none; width: 40px; height: 40px; border-radius: 50%; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .send-btn:hover { background: #aecbfa; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <span id="headerTitle">Версия: Среда</span>
        <select class="mode-select" id="modeSelect" onchange="changeMode()">
            <option value="wednesday">Среда (Умный)</option>
            <option value="thursday">Четверг (Креативный)</option>
        </select>
    </div>
    
    <div class="chat-messages" id="chatMessages">
        <div class="msg-row ai">
            <div class="avatar">AI</div>
            <div class="bubble" id="welcomeText">Привет! Я версия «Среда». Сервер Cloudflare подключен и готов к работе.</div>
        </div>
    </div>
    
    <div class="input-wrapper">
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Введите сообщение..." onkeydown="if(event.key==='Enter')sendMessage()">
        </div>
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
</div>

<script>
    // Ссылка на твой личный сервер Cloudflare
    const WORKER_URL = "https://raspy-rain-b35e.suleimanisachanov123456789.workers.dev";

    function changeMode() {
        const mode = document.getElementById('modeSelect').value;
        const title = document.getElementById('headerTitle');
        const welcome = document.getElementById('welcomeText');
        
        if (mode === 'wednesday') {
            title.innerText = "Версия: Среда";
            welcome.innerText = "Привет! Я версия «Среда». Нацелена на точные ответы, логику и учебу.";
        } else {
            title.innerText = "Версия: Четверг";
            welcome.innerText = "Йоу! Я версия «Четверг». Готов генерировать идеи и общаться на любые темы!";
        }
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const messages = document.getElementById('chatMessages');
        const mode = document.getElementById('modeSelect').value;
        const text = input.value.trim();
        if (!text) return;

        // Выводим сообщение пользователя в чат
        messages.innerHTML += `
            <div class="msg-row user">
                <div class="avatar">Я</div>
                <div class="bubble">${escapeHtml(text)}</div>
            </div>`;
        input.value = '';
        messages.scrollTop = messages.scrollHeight;

        // Индикатор загрузки
        const loadId = 'load-' + Date.now();
        messages.innerHTML += `
            <div class="msg-row ai" id="${loadId}">
                <div class="avatar">AI</div>
                <div class="bubble">Запрос отправлен на сервер...</div>
            </div>`;
        messages.scrollTop = messages.scrollHeight;

        try {
            // Отправляем запрос на наш Cloudflare Worker
            const response = await fetch(`${WORKER_URL}/?query=${encodeURIComponent(text)}&mode=${mode}`);
            const data = await response.json();
            
            const loadEl = document.getElementById(loadId);
            loadEl.outerHTML = `
                <div class="msg-row ai">
                    <div class="avatar">AI</div>
                    <div class="bubble">${escapeHtml(data.response).replace(/\n/g, '<br>')}</div>
                </div>`;
        } catch (err) {
            const loadEl = document.getElementById(loadId);
            loadEl.outerHTML = `
                <div class="msg-row ai">
                    <div class="avatar">AI</div>
                    <div class="bubble">Ошибка связи с сервером. Проверь соединение!</div>
                </div>`;
        }
        messages.scrollTop = messages.scrollHeight;
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>

</body>
</html>
