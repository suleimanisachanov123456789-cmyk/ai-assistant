<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Среда и Четверг — ИИ Ассистент</title>
<meta name="description" content="Интеллектуальный мультиязычный ассистент и генератор артов Суббота. Создатель: Сулейман Исаханов.">
<meta name="theme-color" content="#0d0c0b">
<meta name="color-scheme" content="dark">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  color-scheme: dark;
  --bg-main: #090807;
  --bg-card: rgba(26, 23, 20, 0.75);
  --bg-card-hover: rgba(38, 33, 28, 0.85);
  --border: rgba(255, 138, 31, 0.16);
  --border-focus: #ff8a1f;
  --primary: #ff8a1f;
  --primary-glow: rgba(255, 138, 31, 0.35);
  --grad: linear-gradient(135deg, #ff9f38 0%, #ff6200 100%);
  --tx: #fdfbf7;
  --tx-muted: #9e9488;
  --ok: #2ad170;
  --err: #ff5454;
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --code-font: 'JetBrains Mono', monospace;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg-main);color:var(--tx);font-family:var(--font);overflow:hidden}

body{
  display:grid;
  grid-template-columns:320px 1fr;
  background:
    radial-gradient(1000px 600px at 10% -10%, rgba(255, 115, 0, 0.12) 0%, transparent 70%),
    radial-gradient(800px 500px at 100% 100%, rgba(255, 77, 0, 0.08) 0%, transparent 60%),
    var(--bg-main);
}

button, input, select, textarea{font:inherit;color:inherit;outline:none}

/* ── САЙДБАР ── */
aside{
  background:rgba(15, 13, 11, 0.85);
  backdrop-filter:blur(24px);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  min-height:0;
  transition:transform .3s cubic-bezier(0.16, 1, 0.3, 1);
  z-index:40;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:20px 18px 16px;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.badge{
  width:44px;
  height:44px;
  border-radius:14px;
  background:var(--grad);
  color:#150800;
  font-weight:800;
  font-size:22px;
  display:grid;
  place-items:center;
  box-shadow:0 6px 20px var(--primary-glow);
  flex-shrink:0;
}
.brand h1{font-size:18px;font-weight:700;letter-spacing:-0.3px;flex:1}
.dev-status{
  font-size:12px;
  font-weight:700;
  padding:4px 10px;
  border-radius:20px;
  background:rgba(42, 209, 112, 0.12);
  color:var(--ok);
  border:1px solid rgba(42, 209, 112, 0.3);
  display:flex;
  align-items:center;
  gap:5px;
}
.dev-status::before{
  content:'';
  width:6px;
  height:6px;
  background:var(--ok);
  border-radius:50%;
  box-shadow:0 0 8px var(--ok);
}

.acct-card{
  margin:14px 16px 6px;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:12px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  backdrop-filter:blur(10px);
}
.acct-email{font-size:13px;font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-coins{font-size:14px;font-weight:800;color:var(--primary);margin-top:2px}
.acct-btn{
  background:#26211c;
  border:1px solid var(--border);
  color:var(--tx);
  border-radius:10px;
  padding:7px 14px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}
.acct-btn:hover{background:var(--grad);color:#120700;box-shadow:0 4px 14px var(--primary-glow)}

.new-chat-btn{
  margin:12px 16px;
  border:0;
  border-radius:14px;
  padding:14px;
  background:var(--grad);
  color:#150800;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  box-shadow:0 6px 24px var(--primary-glow);
  transition:.2s;
}
.new-chat-btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.new-chat-btn:active{transform:translateY(1px)}

.search-input{
  margin:0 16px 12px;
  background:rgba(20, 18, 15, 0.6);
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px 14px;
  color:var(--tx);
  font-size:14px;
  transition:.2s;
}
.search-input:focus{border-color:var(--border-focus);box-shadow:0 0 16px var(--primary-glow)}

#list{
  flex:1;
  overflow-y:auto;
  padding:0 12px;
}
.chat-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  border-radius:12px;
  cursor:pointer;
  color:var(--tx-muted);
  font-size:14px;
  font-weight:500;
  margin-bottom:4px;
  transition:.15s;
}
.chat-item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item:hover{background:var(--bg-card);color:var(--tx)}
.chat-item.active{background:rgba(255,138,31,0.12);color:var(--primary);border:1px solid var(--border)}
.chat-item .del-btn{opacity:0;cursor:pointer;font-size:16px;transition:.15s}
.chat-item:hover .del-btn{opacity:0.7}
.chat-item .del-btn:hover{opacity:1;color:var(--err)}

.aside-footer{
  padding:14px 16px;
  border-top:1px solid rgba(255,255,255,0.06);
  background:rgba(12, 10, 8, 0.95);
}
.persona-toggle{
  display:flex;
  background:rgba(22, 19, 15, 0.9);
  border:1px solid var(--border);
  border-radius:14px;
  padding:4px;
  margin-bottom:12px;
}
.persona-btn{
  flex:1;
  background:none;
  border:0;
  border-radius:10px;
  padding:9px;
  font-size:14px;
  font-weight:700;
  color:var(--tx-muted);
  cursor:pointer;
  transition:.2s;
}
.persona-btn.active{background:var(--grad);color:#150800;box-shadow:0 4px 16px var(--primary-glow)}

.quick-tools{display:grid;grid-template-columns:repeat(4, 1fr);gap:6px}
.tool-btn{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:10px;
  padding:8px 0;
  text-align:center;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}
.tool-btn:hover{border-color:var(--primary);color:var(--primary)}
.tool-btn.wide{grid-column:span 2}

/* ── ОСНОВНОЙ КОНТЕНТ ── */
section{
  display:flex;
  flex-direction:column;
  min-width:0;
  height:100%;
  position:relative;
}

.top-bar{
  display:none;
  align-items:center;
  justify-content:space-between;
  padding:12px 16px;
  background:rgba(15, 13, 11, 0.85);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  z-index:20;
}
.menu-btn{
  width:40px;
  height:40px;
  border-radius:12px;
  background:var(--bg-card);
  border:1px solid var(--border);
  font-size:20px;
  display:grid;
  place-items:center;
  cursor:pointer;
}
.top-title{font-size:16px;font-weight:700}
.top-coins{
  background:rgba(255, 138, 31, 0.12);
  border:1px solid var(--border);
  padding:6px 14px;
  border-radius:30px;
  font-size:13px;
  font-weight:800;
  color:var(--primary);
  cursor:pointer;
}

#msgs{
  flex:1;
  overflow-y:auto;
  padding:24px 20px;
  scroll-behavior:smooth;
}
.chat-wrap{max-width:860px;margin:0 auto}

/* ── ПРИВЕТСТВИЕ ── */
.welcome{text-align:center;padding:8vh 12px 20px}
.welcome-logo{
  width:96px;
  height:96px;
  margin:0 auto 20px;
  border-radius:28px;
  background:radial-gradient(circle at 30% 30%, #3a2211, #16120d);
  border:1px solid var(--border);
  display:grid;
  place-items:center;
  box-shadow:0 12px 40px var(--primary-glow);
}
.welcome h2{
  font-size:32px;
  font-weight:800;
  letter-spacing:-0.5px;
  margin-bottom:8px;
  background:var(--grad);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.welcome p{color:var(--tx-muted);font-size:16px;max-width:540px;margin:0 auto 28px}
.chips-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:30px;
  padding:10px 18px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:.2s;
  backdrop-filter:blur(8px);
}
.chip:hover{
  border-color:var(--primary);
  transform:translateY(-2px);
  box-shadow:0 6px 20px var(--primary-glow);
  color:var(--primary);
}

/* ── ПУЗЫРИ СООБЩЕНИЙ ── */
.msg{display:flex;gap:14px;margin-bottom:22px;animation:fadeUp .25s ease forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg-avatar{
  width:38px;
  height:38px;
  border-radius:12px;
  background:var(--grad);
  color:#150800;
  font-weight:900;
  font-size:16px;
  display:grid;
  place-items:center;
  flex-shrink:0;
  box-shadow:0 4px 14px var(--primary-glow);
}
.msg.me{flex-direction:row-reverse}
.msg.me .msg-avatar{background:#2a231b;color:var(--tx);box-shadow:none}

.bubble{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:14px 18px;
  max-width:min(720px, calc(100% - 56px));
  font-size:15.5px;
  line-height:1.65;
  box-shadow:0 8px 30px rgba(0,0,0,0.25);
  backdrop-filter:blur(12px);
  word-break:break-word;
}
.msg.me .bubble{
  background:rgba(255, 138, 31, 0.12);
  border-color:rgba(255, 138, 31, 0.35);
}

.bubble pre{
  background:#090807;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:14px;
  padding:14px;
  margin:10px 0;
  overflow-x:auto;
  font-family:var(--code-font);
  font-size:13.5px;
}
.bubble code{font-family:var(--code-font);background:rgba(255,255,255,0.06);padding:2px 6px;border-radius:6px;font-size:0.92em}
.bubble pre code{background:none;padding:0}
.bubble a{color:var(--primary);text-decoration:none}
.bubble a:hover{text-decoration:underline}

.bubble img.art-pic{
  display:block;
  width:100%;
  max-height:560px;
  border-radius:16px;
  border:1px solid var(--border);
  margin:10px 0 6px;
  box-shadow:0 12px 40px rgba(0,0,0,0.6);
  cursor:zoom-in;
  object-fit:cover;
  transition:transform .2s;
}
.bubble img.art-pic:hover{transform:scale(1.005)}

.card-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.action-btn{
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);
  border-radius:10px;
  padding:6px 12px;
  font-size:13px;
  font-weight:600;
  color:var(--tx-muted);
  cursor:pointer;
  transition:.15s;
}
.action-btn:hover{color:var(--tx);border-color:var(--primary);background:rgba(255,138,31,0.08)}

/* ── ПАНЕЛЬ ВВОДА ── */
.input-panel{
  padding:14px 20px 20px;
  background:linear-gradient(180deg, transparent 0%, rgba(9, 8, 7, 0.95) 40%);
  border-top:1px solid rgba(255, 138, 31, 0.08);
}
.draw-bar{
  display:none;
  gap:8px;
  max-width:860px;
  margin:0 auto 10px;
  animation:fadeUp .2s ease forwards;
}
.draw-bar.open{display:flex}
.draw-select{
  flex:1;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:8px 12px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}

.input-box{
  max-width:860px;
  margin:0 auto;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:24px;
  padding:8px 10px;
  display:flex;
  align-items:flex-end;
  gap:10px;
  backdrop-filter:blur(20px);
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
  transition:border-color .2s, box-shadow .2s;
}
.input-box:focus-within{border-color:var(--border-focus);box-shadow:0 0 24px var(--primary-glow)}
.input-box textarea{
  flex:1;
  background:none;
  border:0;
  padding:10px 8px;
  color:var(--tx);
  resize:none;
  max-height:160px;
  line-height:1.5;
  font-size:15.5px;
}
.icon-btn{
  width:44px;
  height:44px;
  border-radius:16px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.06);
  display:grid;
  place-items:center;
  font-size:19px;
  cursor:pointer;
  transition:.2s;
  flex-shrink:0;
}
.icon-btn:hover{background:rgba(255,138,31,0.15);border-color:var(--primary)}
.icon-btn.active{background:var(--grad);color:#150800;border-color:transparent;box-shadow:0 4px 16px var(--primary-glow)}
.send-btn{background:var(--grad);color:#150800;border:0;font-weight:800;box-shadow:0 4px 16px var(--primary-glow)}
.send-btn:disabled{opacity:0.4;cursor:not-allowed}

.footer-hint{text-align:center;color:var(--tx-muted);font-size:12.5px;margin-top:10px}

/* ── МОДАЛЬНОЕ ОКНО ── */
#authModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  backdrop-filter:blur(16px);
  display:none;
  place-items:center;
  padding:16px;
  z-index:100;
}
#authModal.open{display:grid}
.modal-card{
  width:100%;
  max-width:440px;
  background:#14120f;
  border:1px solid var(--border);
  border-radius:24px;
  padding:32px 28px;
  position:relative;
  box-shadow:0 24px 60px rgba(0,0,0,0.8);
}
.modal-close{
  position:absolute;
  top:16px;
  right:18px;
  background:none;
  border:0;
  font-size:24px;
  color:var(--tx-muted);
  cursor:pointer;
}

#lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.92);
  backdrop-filter:blur(12px);
  display:none;
  place-items:center;
  padding:20px;
  z-index:120;
  cursor:zoom-out;
}
#lightbox.open{display:grid}
#lightbox img{max-width:96vw;max-height:92vh;border-radius:20px;border:1px solid var(--border)}

#toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:rgba(20, 18, 15, 0.95);
  border:1px solid var(--primary);
  border-radius:30px;
  padding:12px 24px;
  font-size:14.5px;
  font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,0.6);
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:200;
}
#toast.open{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── МОБИЛЬНЫЙ ВИД И СИМУЛЯТОР ПК ── */
.overlay{display:none}
@media (max-width:820px){
  body{grid-template-columns:1fr}
  aside{
    position:fixed;
    inset:0 auto 0 0;
    width:300px;
    max-width:85vw;
    transform:translateX(-102%);
    box-shadow:none;
  }
  body.sidebar-open aside{transform:none;box-shadow:0 0 80px #000}
  body.sidebar-open .overlay{
    display:block;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.65);
    z-index:35;
  }
  .top-bar{display:flex}
  #msgs{padding:16px 12px}
  .footer-hint{display:none}
}

html.phone-sim{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  background:#050504;
}
html.phone-sim body{
  width:400px;
  height:840px;
  margin:auto;
  border:14px solid #1c1814;
  border-radius:48px;
  box-shadow:0 30px 90px rgba(0,0,0,0.9), 0 0 0 2px rgba(255,138,31,0.2);
  grid-template-columns:1fr;
}
html.phone-sim aside{
  position:fixed;
  inset:0 auto 0 0;
  width:300px;
  transform:translateX(-102%);
}
html.phone-sim body.sidebar-open aside{transform:none}
html.phone-sim body.sidebar-open .overlay{display:block;position:absolute;inset:0;background:rgba(0,0,0,0.6);z-index:35}
html.phone-sim .top-bar{display:flex}
html.phone-sim #msgs{padding:14px 10px}
html.phone-sim .footer-hint{display:none}
</style>
</head>
<body>

<aside id="aside">
  <div class="brand">
    <div class="badge" id="bd">Ч</div>
    <h1 id="brandTitle">Среда и Четверг</h1>
    <div class="dev-status">онлайн</div>
  </div>

  <div class="acct-card">
    <div>
      <div class="acct-email" id="acctMail">suleiman@gmail.com</div>
      <div class="acct-coins">🪙 <span id="acctCoins">10 000</span></div>
    </div>
    <button type="button" class="acct-btn" id="acctBtn">Кошелёк</button>
  </div>

  <button type="button" class="new-chat-btn" id="newChatBtn">
    <span>+</span> <span id="newChatTxt">Новый диалог</span>
  </button>

  <input type="text" class="search-input" id="srch" placeholder="🔍 Поиск диалогов..." autocomplete="off">
  
  <div id="list"></div>

  <div class="aside-footer">
    <div class="persona-toggle">
      <button type="button" class="persona-btn" id="btnWed" data-m="wednesday">Среда</button>
      <button type="button" class="persona-btn active" id="btnThu" data-m="thursday">Четверг</button>
    </div>
    <div class="quick-tools">
      <button type="button" class="tool-btn wide" id="simToggle">📱 Смартфон</button>
      <button type="button" class="tool-btn" id="langBtn">🌐 RU</button>
      <button type="button" class="tool-btn" id="voiceToggle">🔊 Вкл</button>
      <button type="button" class="tool-btn" id="clearBtn" title="Очистить историю">🗑️</button>
      <button type="button" class="tool-btn" id="exportBtn" title="Скачать текст">⬇ TXT</button>
    </div>
  </div>
</aside>

<div class="overlay" id="overlay"></div>

<section>
  <div class="top-bar">
    <button type="button" class="menu-btn" id="menuBtn">☰</button>
    <div class="top-title" id="topTitle">Среда и Четверг</div>
    <div class="top-coins" id="topCoins">🪙 10000</div>
  </div>

  <div id="msgs">
    <div class="chat-wrap" id="wrap"></div>
  </div>

  <div class="input-panel">
    <div class="draw-bar" id="drawBar">
      <select class="draw-select" id="selStyle">
        <option value="auto">Стиль: Кинематографичный</option>
        <option value="photo">Фотореализм 8K</option>
        <option value="art">Эпический концепт-арт</option>
        <option value="anime">Аниме студии Макото Синкая</option>
        <option value="3d">3D Render Unreal Engine 5</option>
        <option value="pixel">16-bit Пиксель-арт</option>
      </select>
      <select class="draw-select" id="selQuality">
        <option value="fast">⚡ Быстро HD (50 🪙)</option>
        <option value="hd">🎨 Ultra HD Flux (100 🪙)</option>
      </select>
    </div>

    <form class="input-box" id="form">
      <button type="button" class="icon-btn" id="drawToggle" title="Режим рисования Субботы">🎨</button>
      <button type="button" class="icon-btn" id="micBtn" title="Голосовой ввод">🎤</button>
      <textarea id="q" rows="1" placeholder="Спроси о чём угодно или «нарисуй огненного дракона»..."></textarea>
      <button type="submit" class="icon-btn send-btn" id="snd">➤</button>
    </form>
    <div class="footer-hint" id="footerHint">Нажми 🔊, чтобы ассистент озвучивал ответы вслух как Алиса</div>
  </div>
</section>

<!-- МОДАЛЬНОЕ ОКНО БАЛАНСА -->
<div id="authModal">
  <div class="modal-card">
    <button type="button" class="modal-close" id="modalClose">×</button>
    <h3 style="font-size:22px;margin-bottom:12px;font-weight:700">Личный кошелёк</h3>
    <p style="color:var(--tx-muted);font-size:14px;margin-bottom:20px;line-height:1.5">
      Каждому аккаунту выделяется личный баланс монет. Если они закончатся — нажми кнопку ниже, чтобы пополнить кошелёк.
    </p>
    <button type="button" class="new-chat-btn" id="refillBtn" style="margin:0 0 12px;width:100%">
      ⚡ Пополнить баланс до 10 000 🪙
    </button>
  </div>
</div>

<div id="lightbox" onclick="this.classList.remove('open')"><img id="lbImg" src="" alt="Просмотр"></div>
<div id="toast"></div>

<script>
const API = "https://raspy-rain-b35e.suleimanisachanov123456789.workers.dev";
const $ = (id) => document.getElementById(id);
const ls = {
  get(k, d = "") { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

const I18N = {
  ru: {
    brand: "Среда и Четверг",
    newChat: "Новый диалог",
    srch: "🔍 Поиск диалогов...",
    wed: "Среда",
    thu: "Четверг",
    placeholder: "Спроси о чём угодно или «нарисуй огненного дракона»...",
    drawPlaceholder: "Опиши изображение для Субботы...",
    orderAccepted: "Суббота приняла заказ! Рисую настоящий шедевр...",
    artDone: "Готово! Твой арт сгенерирован.",
    chips: [
      ["⚔️ Меч Зульфикар", "нарисуй легендарный меч Зульфикар в эпическом неоновом стиле"],
      ["🐉 Огненный дракон", "нарисуй гигантского огненного дракона над ночным городом"],
      ["🌦 Погода на 3 дня", "какая погода сегодня и прогноз на 3 дня?"],
      ["💻 Скрипт для Roblox", "Напиши чистый скрипт таймера на Luau для Roblox Studio"],
      ["🌌 Что будет в ноябре 2026", "расскажи подробно, какие события и явления ожидаются в ноябре 2026 года"],
      ["🔐 Надёжный пароль", "/пароль 16"],
      ["😄 Расскажи шутку", "/шутка"]
    ]
  },
  en: {
    brand: "Wednesday & Thursday",
    newChat: "New Chat",
    srch: "🔍 Search chats...",
    wed: "Wednesday",
    thu: "Thursday",
    placeholder: "Ask anything or 'draw a fire dragon'...",
    drawPlaceholder: "Describe your artwork for Saturday AI...",
    orderAccepted: "Saturday accepted your prompt! Crafting artwork...",
    artDone: "Done! Your image has been created.",
    chips: [
      ["⚔️ Zulfiqar Sword", "draw legendary sword Zulfiqar in epic glowing neon style"],
      ["🐉 Fire Dragon", "draw majestic fire dragon flying over a futuristic neon city"],
      ["🌦 3-Day Weather", "what is the weather today and 3-day forecast?"],
      ["💻 Roblox Luau Script", "Write a clean timer script in Luau for Roblox Studio"],
      ["🌌 November 2026 Events", "what major world and science events are expected in November 2026?"],
      ["🔐 Password", "/пароль 16"],
      ["😄 Tell Joke", "/шутка"]
    ]
  },
  de: {
    brand: "Mittwoch & Donnerstag",
    newChat: "Neuer Chat",
    srch: "🔍 Chat suchen...",
    wed: "Mittwoch",
    thu: "Donnerstag",
    placeholder: "Frag etwas oder «zeichne einen Drachen»...",
    drawPlaceholder: "Beschreibe dein Bild für Samstag...",
    orderAccepted: "Samstag hat den Auftrag angenommen! Zeichne dein Bild...",
    artDone: "Fertig! Schau dir dein Bild an.",
    chips: [
      ["⚔️ Zulfiqar Schwert", "zeichne das legendäre Schwert Zulfiqar im Neon-Stil"],
      ["🐉 Feuerdrache", "zeichne einen Feuerdrachen über einer nächtlichen Stadt"],
      ["🌦 Wetterbericht", "wie ist das Wetter heute und in 3 Tagen?"],
      ["💻 Roblox Luau Skript", "Schreibe ein Luau-Skript für Roblox Studio"],
      ["🌌 November 2026", "Was passiert im November 2026?"],
      ["🔐 Passwort", "/пароль 16"],
      ["😄 Witz", "/шутка"]
    ]
  }
};

let currentLang = ls.get("lang", "ru");
if (!I18N[currentLang]) currentLang = "ru";

let userEmail = ls.get("userEmail", "suleimanisachanov123456789@gmail.com");
let voiceEnabled = ls.get("voiceEnabled", "true") === "true";

function getWalletCoins() {
  const v = ls.get("coins_" + userEmail, "");
  return v === "" ? 10000 : Math.max(0, Number(v) || 0);
}
function setWalletCoins(val) {
  ls.set("coins_" + userEmail, String(Math.max(0, val)));
}

let userCoins = getWalletCoins();
let mode = ls.get("mode", "thursday") === "wednesday" ? "wednesday" : "thursday";
let busy = false, drawMode = false, D = [], cur = null;
try {
  const p = JSON.parse(ls.get("dlgs_v2", "[]"));
  if (Array.isArray(p)) D = p.filter((x) => x && typeof x === "object" && Array.isArray(x.msgs));
} catch { D = []; }

function applyLang() {
  const t = I18N[currentLang];
  $("brandTitle").textContent = t.brand;
  $("topTitle").textContent = t.brand;
  $("newChatTxt").textContent = t.newChat;
  $("srch").placeholder = t.srch;
  $("btnWed").textContent = t.wed;
  $("btnThu").textContent = t.thu;
  $("langBtn").textContent = "🌐 " + currentLang.toUpperCase();
  $("q").placeholder = drawMode ? t.drawPlaceholder : t.placeholder;
  renderMsgs();
}

$("langBtn").onclick = () => {
  const order = ["ru", "en", "de"];
  currentLang = order[(order.indexOf(currentLang) + 1) % order.length];
  ls.set("lang", currentLang);
  applyLang();
  toast("Язык: " + currentLang.toUpperCase());
};

function updateCoinsUI() {
  $("acctCoins").textContent = userCoins.toLocaleString();
  $("topCoins").textContent = "🪙 " + userCoins.toLocaleString();
}

function updateVoiceUI() {
  $("voiceToggle").textContent = voiceEnabled ? "🔊 Вкл" : "🔇 Выкл";
  $("voiceToggle").classList.toggle("active", voiceEnabled);
}

function speak(text, character = mode) {
  if (!voiceEnabled || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/[*#_`]/g, "").replace(/https?:\/\/\S+/g, "").trim();
  if (!clean) return;

  const u = new SpeechSynthesisUtterance(clean);
  u.lang = currentLang === "de" ? "de-DE" : currentLang === "en" ? "en-US" : "ru-RU";
  const voices = window.speechSynthesis.getVoices();

  if (character === "wednesday") {
    u.pitch = 1.15; u.rate = 1.0;
    const f = voices.find(v => v.lang.startsWith(currentLang) && /female|milena|tatyana|irina|anna|marlene/i.test(v.name));
    if (f) u.voice = f;
  } else if (character === "sat") {
    u.pitch = 1.25; u.rate = 1.05;
  } else {
    u.pitch = 0.95; u.rate = 1.02;
    const m = voices.find(v => v.lang.startsWith(currentLang) && /male|yuri|dmitry|alexander|david|stefan/i.test(v.name));
    if (m) u.voice = m;
  }
  window.speechSynthesis.speak(u);
}

$("voiceToggle").onclick = () => {
  voiceEnabled = !voiceEnabled;
  ls.set("voiceEnabled", String(voiceEnabled));
  updateVoiceUI();
  if (voiceEnabled) speak("Голос активирован!");
  else window.speechSynthesis?.cancel();
};

$("acctBtn").onclick = () => $("authModal").classList.add("open");
$("topCoins").onclick = () => $("authModal").classList.add("open");
$("modalClose").onclick = () => $("authModal").classList.remove("open");
$("refillBtn").onclick = () => {
  userCoins = 10000;
  setWalletCoins(userCoins);
  updateCoinsUI();
  $("authModal").classList.remove("open");
  toast("Баланс пополнен: 10 000 🪙");
  speak("Баланс пополнен на десять тысяч монет!");
};

function toast(msg) {
  const d = $("toast");
  d.textContent = msg;
  d.classList.add("open");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => d.classList.remove("open"), 3800);
}

const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function md(src) {
  return String(src).split(/```/).map((chunk, i) => {
    if (i % 2) {
      return `<pre><code>${esc(chunk.replace(/^[\w+#-]*\n/, ""))}</code></pre>`;
    }
    return esc(chunk)
      .replace(/!\[([^\]]*)\]\((data:image\/[^)]+|https?:\/\/[^)]+)\)/g, '<img class="art-pic" src="$2" alt="$1" onclick="openLightbox(this.src)">')
      .replace(/`([^`\n]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
      .replace(/\n/g, "<br>");
  }).join("");
}

window.openLightbox = (src) => {
  $("lbImg").src = src;
  $("lightbox").classList.add("open");
};

function saveChats() {
  try {
    ls.set("dlgs_v2", JSON.stringify(D.slice(0, 30)));
  } catch {}
}

function renderList() {
  const l = $("list");
  l.innerHTML = "";
  const q = $("srch").value.toLowerCase();
  D.filter(d => (d.title || "").toLowerCase().includes(q)).forEach(d => {
    const item = document.createElement("div");
    item.className = "chat-item" + (d === cur ? " active" : "");
    item.innerHTML = `<span>💬 ${esc(d.title || "Диалог")}</span><b class="del-btn" title="Удалить">×</b>`;
    item.onclick = (e) => {
      if (e.target.classList.contains("del-btn")) {
        D = D.filter(x => x !== d);
        if (cur === d) cur = null;
        saveChats(); renderList(); renderMsgs();
        return;
      }
      cur = d;
      renderList();
      renderMsgs();
      document.body.classList.remove("sidebar-open");
    };
    l.appendChild(item);
  });
}

function renderMsgs() {
  const w = $("wrap");
  w.innerHTML = "";
  const t = I18N[currentLang];

  if (!cur || !cur.msgs || !cur.msgs.length) {
    w.innerHTML = `
      <div class="welcome">
        <div class="welcome-logo">
          <svg viewBox="0 0 100 100" fill="none" style="width:60px;height:60px;filter:drop-shadow(0 0 10px #ff8a1f88)">
            <path d="M18 22 C36 24, 58 42, 73 64 L67 70 C50 48, 30 33, 12 28 L25 26 L18 22 Z" fill="url(#zg)" stroke="#ffb04a" stroke-width="2"/>
            <path d="M62 74 C67 69, 73 63, 78 58" stroke="#ff8a1f" stroke-width="5" stroke-linecap="round"/>
            <path d="M72 68 L84 80" stroke="#ff8a1f" stroke-width="6" stroke-linecap="round"/>
            <defs><linearGradient id="zg" x1="12" y1="22" x2="84" y2="80" gradientUnits="userSpaceOnUse"><stop stop-color="#ffb04a"/><stop offset="1" stop-color="#ff6a00"/></linearGradient></defs>
          </svg>
        </div>
        <h2>${t.brand}</h2>
        <p>Интеллектуальный диалог, помощь в коде и генерация артов Субботой</p>
        <div class="chips-grid"></div>
      </div>
    `;
    const grid = w.querySelector(".chips-grid");
    t.chips.forEach(([lbl, query]) => {
      const b = document.createElement("button");
      b.className = "chip";
      b.textContent = lbl;
      b.onclick = () => window.ask(query);
      grid.appendChild(b);
    });
  } else {
    cur.msgs.forEach(m => appendBubbleUI(m.role, m.who, m.content, m.imgSrc, m.info));
  }
  $("msgs").scrollTop = $("msgs").scrollHeight;
}

function ensureChat(title) {
  if (!cur) {
    cur = { id: Date.now(), title: title.slice(0, 32), msgs: [] };
    D.unshift(cur);
    saveChats();
    renderList();
    renderMsgs();
  }
}

function appendBubbleUI(role, who, content, imgSrc = null, info = null) {
  const box = document.createElement("div");
  box.className = "msg " + (role === "user" ? "me" : "bot");

  const avatar = document.createElement("div");
  avatar.className = "msg-avatar";
  avatar.textContent = role === "user" ? "Я" : who === "sat" ? "🎨" : (who || mode) === "wednesday" ? "С" : "Ч";

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  if (imgSrc) {
    bubble.innerHTML = `<div>${md(content)}</div><img class="art-pic" src="${imgSrc}" alt="Суббота Арт" onclick="openLightbox(this.src)"><div style="font-size:12.5px;color:var(--tx-muted);margin-top:4px">${info || ""}</div>`;
    const acts = document.createElement("div");
    acts.className = "card-actions";
    acts.innerHTML = `<button type="button" class="action-btn" onclick="downloadArt('${imgSrc}')">⬇ Скачать</button><button type="button" class="action-btn" onclick="openLightbox('${imgSrc}')">🔍 Просмотр</button>`;
    bubble.appendChild(acts);
  } else {
    bubble.innerHTML = md(content);
  }

  box.append(avatar, bubble);
  $("wrap").appendChild(box);
  $("msgs").scrollTop = $("msgs").scrollHeight;
  return bubble;
}

window.downloadArt = (src) => {
  const a = document.createElement("a");
  a.href = src;
  a.download = "saturday-art.jpg";
  document.body.appendChild(a);
  a.click();
  a.remove();
};

async function chatSend(text) {
  ensureChat(text);
  cur.msgs.push({ role: "user", content: text });
  appendBubbleUI("user", null, text);

  const botBubble = appendBubbleUI("assistant", mode, "Думаю...");
  const hist = cur.msgs.slice(-8).map(m => ({ role: m.role, content: m.content }));

  try {
    const res = await fetch(API + "/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        query: text,
        mode,
        history: hist,
        uid: userEmail,
        lang: currentLang
      })
    });
    const data = await res.json();
    let reply = (data.response || "").replace(/^\s*\[.*?\]:\s*/i, "").trim();
    if (!reply) reply = "Готов продолжить диалог!";

    botBubble.innerHTML = md(reply);
    cur.msgs.push({ role: "assistant", content: reply, who: mode });
    saveChats();
    speak(reply, mode);
  } catch (err) {
    botBubble.innerHTML = '<span style="color:var(--err)">Сервер временно недоступен. Попробуй ещё раз через пару секунд!</span>';
  }
}

async function drawSend(prompt) {
  const cost = $("selQuality").value === "fast" ? 50 : 100;
  if (userCoins < cost) {
    toast(`Не хватает монет: нужно ${cost} 🪙, у тебя ${userCoins} 🪙`);
    return;
  }

  ensureChat("🎨 " + prompt);
  cur.msgs.push({ role: "user", content: "🎨 " + prompt });
  appendBubbleUI("user", null, "🎨 " + prompt);

  const t = I18N[currentLang];
  speak(t.orderAccepted, "sat");

  const bubble = appendBubbleUI("assistant", "sat", "Суббота генерирует изображение в Base64...");

  try {
    const res = await fetch(API + "/saturday", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        uid: userEmail,
        prompt: prompt + ", " + $("selStyle").value,
        quality: $("selQuality").value
      })
    });
    const data = await res.json();

    if (!data.ok || !data.image) {
      throw new Error(data.error || "Сбой генерации");
    }

    userCoins = Math.max(0, userCoins - cost);
    setWalletCoins(userCoins);
    updateCoinsUI();

    const info = `1024×1024 · ${data.model || "flux"} · -${cost} 🪙`;
    bubble.innerHTML = `<div><b>${esc(prompt)}</b></div><img class="art-pic" src="${data.image}" alt="Арт" onclick="openLightbox(this.src)"><div style="font-size:12px;color:var(--tx-muted);margin-top:4px">${info}</div>`;
    
    const acts = document.createElement("div");
    acts.className = "card-actions";
    acts.innerHTML = `<button type="button" class="action-btn" onclick="downloadArt('${data.image}')">⬇ Скачать</button><button type="button" class="action-btn" onclick="openLightbox('${data.image}')">🔍 Просмотр</button>`;
    bubble.appendChild(acts);

    cur.msgs.push({ role: "assistant", content: prompt, who: "sat", imgSrc: data.image, info });
    saveChats();
    speak(t.artDone, "sat");
  } catch (e) {
    bubble.innerHTML = '<span style="color:var(--err)">Не удалось сгенерировать изображение. Попробуй изменить запрос!</span>';
  }
}

const DRAW_RE = /^(?:\/нарисуй|нарисуй|\/суббота|draw|paint|zeichne|(?:сгенерируй|создай|сделай)(?:\s+мне)?(?:\s+картинк\S*|\s+фото\S*|\s+изображени\S*|\s+арт)?)\s+([\s\S]+)$/i;

window.ask = async function(text) {
  text = String(text || "").trim();
  if (busy || !text) return;
  busy = true;
  $("snd").disabled = true;

  const dm = text.match(DRAW_RE);
  try {
    if (drawMode || dm) {
      const p = drawMode ? text : dm[1].trim();
      await drawSend(p);
    } else {
      await chatSend(text);
    }
  } finally {
    busy = false;
    $("snd").disabled = false;
  }
};

$("form").onsubmit = (e) => {
  e.preventDefault();
  const v = $("q").value;
  $("q").value = "";
  $("q").style.height = "auto";
  window.ask(v);
};

$("q").onkeydown = (e) => {
  if (e.key === "Enter" && !e.shiftKey && !/Mobi|Android/i.test(navigator.userAgent)) {
    e.preventDefault();
    $("form").requestSubmit();
  }
};
$("q").oninput = (e) => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 160) + "px";
};

$("newChatBtn").onclick = () => {
  cur = null;
  renderMsgs();
  renderList();
  document.body.classList.remove("sidebar-open");
  $("q").focus();
};

$("menuBtn").onclick = () => document.body.classList.add("sidebar-open");
$("overlay").onclick = () => document.body.classList.remove("sidebar-open");

$("drawToggle").onclick = () => {
  drawMode = !drawMode;
  $("drawToggle").classList.toggle("active", drawMode);
  $("drawBar").classList.toggle("open", drawMode);
  applyLang();
};

$("btnWed").onclick = () => {
  mode = "wednesday";
  ls.set("mode", mode);
  $("bd").textContent = "С";
  $("btnWed").classList.add("active");
  $("btnThu").classList.remove("active");
  speak("Среда готова к работе.");
};
$("btnThu").onclick = () => {
  mode = "thursday";
  ls.set("mode", mode);
  $("bd").textContent = "Ч";
  $("btnThu").classList.add("active");
  $("btnWed").classList.remove("active");
  speak("Четверг на связи!");
};

$("simToggle").onclick = () => {
  const isSim = document.documentElement.classList.toggle("phone-sim");
  $("simToggle").textContent = isSim ? "🖥 ПК вид" : "📱 Смартфон";
};

$("clearBtn").onclick = () => {
  if (confirm("Удалить все сохранённые диалоги?")) {
    D = [];
    cur = null;
    saveChats();
    renderList();
    renderMsgs();
    toast("Все диалоги удалены.");
  }
};

$("exportBtn").onclick = () => {
  if (!cur || !cur.msgs || !cur.msgs.length) return toast("Диалог пуст.");
  const text = cur.msgs.map(m => (m.role === "user" ? "Я: " : "ИИ: ") + m.content).join("\n\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/plain;charset=utf-8" }));
  a.download = (cur.title || "dialog") + ".txt";
  a.click();
};

$("srch").oninput = renderList;

// Инициализация
if (mode === "wednesday") {
  $("bd").textContent = "С";
  $("btnWed").classList.add("active");
  $("btnThu").classList.remove("active");
}
applyLang();
updateCoinsUI();
updateVoiceUI();
renderList();
renderMsgs();
</script>
</body>
</html>
